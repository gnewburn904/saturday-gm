<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17261f"><title>Saturday GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"><style>
:root{
  --bg:#f5f2eb;
  --panel:#f5f2eb;
  --panel2:#eae4d7;
  --ink:#161614;
  --muted:#5c5a54;
  --line:#d5cfc1;
  --rule:#161614;
  --lime:#161614;
  --gold:#9a6510;
  --red:#b82924;
  --green:#1a663d;
  --black:#f5f2eb;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{
  cursor:pointer;
  border:1px solid var(--rule);
  background:transparent;
  padding:9px 14px;
  border-radius:2px;
  font-weight:700;
  transition:background-color .15s ease,color .15s ease;
}
button:hover:not(:disabled){background:var(--panel2)}
button:disabled{cursor:not-allowed;opacity:.38}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{
  outline:2px solid var(--rule);
  outline-offset:2px;
}
.primary{
  background:var(--rule);
  color:var(--bg);
  border-color:var(--rule);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.primary:hover:not(:disabled){background:#2e2e2a}
.ghost{border-color:transparent;background:transparent}
.ghost:hover:not(:disabled){border-color:var(--line);background:var(--panel2)}
.small{padding:5px 10px;font-size:12px}
.danger{color:var(--red)}
.positive{color:var(--green)}
.gold{color:var(--gold)}
.muted{color:var(--muted)}
.eyebrow{
  font-size:11px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  font-weight:800;
  color:var(--muted);
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:auto;padding:0 24px}

/* Top bar & Editorial Masthead */
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:16px}
.brand{
  font-family:var(--display);
  font-size:28px;
  font-weight:800;
  letter-spacing:.04em;
  line-height:1;
}
.brand span{color:var(--muted)}
.navright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.hero{
  background:var(--bg);
  border-top:4px solid var(--rule);
  border-bottom:2px solid var(--rule);
}
.hero.has-school{position:relative;border-bottom:0}
.hero.has-school::after{
  content:"";
  position:absolute;
  bottom:0;left:0;right:0;
  height:5px;
  background:linear-gradient(90deg,var(--school1) 0 78%,var(--school2) 78% 100%);
  pointer-events:none;
}
.hero .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:22px;
  min-height:124px;
  padding-top:20px;
  padding-bottom:22px;
}
h1,h2,h3,p{margin:0}
h1,.record,.metric b{
  font-family:var(--display);
  font-weight:800;
  letter-spacing:0;
  line-height:1;
}
.hero h1{
  font-size:clamp(44px,7.5vw,84px);
  letter-spacing:.01em;
  text-transform:uppercase;
  margin-top:4px;
}
h2{
  font-family:var(--display);
  font-size:27px;
  font-weight:800;
  letter-spacing:.015em;
  text-transform:uppercase;
  line-height:1.1;
}
h3{font-size:15px;font-weight:800;line-height:1.25}
.hero-title{min-width:0}
.hero-meta{display:flex;flex-shrink:0;gap:24px;text-align:right;align-items:center}
.hero-meta>div{border-left:1px solid var(--line);padding-left:18px}
.hero-meta span{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:10px;
  font-weight:700;
}
.hero-meta b{
  display:block;
  font:800 36px/1.05 var(--display);
  color:var(--ink);
  white-space:nowrap;
}

/* Main layout & Sections (No SaaS cards) */
main{padding-top:22px!important;padding-bottom:64px!important}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tabs button{border-color:var(--line)}
.tabs button[aria-pressed=true]{
  color:var(--bg);
  background:var(--rule);
  border-color:var(--rule);
}

.section{
  border:0;
  border-top:2px solid var(--rule);
  border-radius:0;
  background:transparent;
  padding:18px 0 6px;
  margin-bottom:24px;
}
.sectionhead{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:start;
  margin-bottom:14px;
}
.sectionhead p{margin-top:4px;font-size:13px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px;align-items:start}
.sidebar{position:sticky;top:16px}
.sidebar>.section:first-child{
  background:var(--panel2);
  border:1px solid var(--rule);
  border-top:4px solid var(--rule);
  padding:18px;
  box-shadow:none;
}

/* Metrics & Progress */
.metrics{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  margin-bottom:16px;
}
.metric{
  background:transparent;
  border:0;
  border-right:1px solid var(--line);
  padding:12px 14px;
  border-radius:0;
  min-width:0;
}
.metric:last-child{border-right:0}
.metric span{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.9px;
}
.metric b{
  font-size:clamp(24px,3.2vw,34px);
  display:block;
  line-height:1.05;
  margin-top:4px;
}
.metric small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

.bar{height:6px;background:var(--line);border-radius:0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rule);border-radius:0;transition:width .25s ease,background-color .25s ease}
.progress{display:flex;gap:3px;margin-top:12px}
.progress i{height:5px;background:var(--line);flex:1;border-radius:0}
.progress i.done{background:var(--rule)}
.progress i.current{background:var(--gold)}

/* Hot seats side-by-side */
.pressure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:24px;align-items:stretch}
.pressure-grid>.section{margin:0;min-width:0;padding:14px 0 0}
.pressure-grid h2{font-size:21px}
.pressure-grid .sectionhead{margin-bottom:8px}
.pressurelabel{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:.01em;text-transform:uppercase}
.pressurebar{height:7px;background:var(--line);border-radius:0;overflow:hidden;margin:8px 0}
.pressurebar i{display:block;height:100%;border-radius:0;transition:width .25s ease,background-color .25s ease}
.fanpanel .budgetline{margin:5px 0;gap:8px}
.fanpanel .budgetline b{white-space:nowrap;font-size:13px}
.fanpanel .budgetline span{font-size:12px}

/* Schemes */
.schemes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-bottom:5px}
.field select{
  width:100%;
  background:#fff;
  border:1px solid var(--rule);
  border-radius:2px;
  padding:8px 10px;
}
.field p{font-size:12px;color:var(--muted);margin-top:5px}
.scheme-impact{
  border:1px solid var(--line);
  border-left:3px solid var(--rule);
  border-radius:0;
  padding:10px 12px;
  margin-top:10px;
  background:var(--panel2);
}
.scheme-impact p{font-size:12px;color:var(--muted);margin-top:5px}
.scheme-impact h3{margin-top:4px}

/* Allocation Ledger */
.preset{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.grouphead{
  padding:12px 8px 6px;
  font-weight:800;
  font-size:11px;
  color:var(--ink);
  background:var(--panel2);
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  letter-spacing:1.4px;
  text-transform:uppercase;
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}
.alloc{
  display:grid;
  grid-template-columns:minmax(130px,1.3fr) minmax(85px,.8fr) minmax(120px,1fr);
  align-items:center;
  gap:12px;
  padding:11px 6px;
  border-bottom:1px solid var(--line);
}
.alloc:nth-of-type(even){background:#ece6da66}
.alloc .pos{font-weight:800;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.alloc .detail{font-size:11px;color:var(--muted);margin-top:3px}
.spendbar{display:none}

/* Sharp Editorial Stamps (Replaces translucent pills) */
.scheme-pill,.market-pill,.rival-pill{
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  border-radius:2px;
  padding:1px 6px;
  font-size:10px;
  font-weight:800;
  line-height:1.35;
  letter-spacing:.07em;
  text-transform:uppercase;
}
.scheme-pill{color:var(--bg);background:var(--rule);border:1px solid var(--rule)}
.scheme-pill[hidden]{display:none}
.market-pill{color:var(--muted);background:transparent;border:1px solid var(--line)}
.market.deep .market-pill{color:var(--green);border-color:var(--green);background:transparent}
.market.scarce .market-pill{color:var(--gold);border-color:var(--gold);background:transparent}
.market{font-size:12px;font-weight:800}
.market small{font-weight:500;color:var(--muted);display:block;margin-top:4px;line-height:1.3}

.room-scout{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
.room-scout .ovr{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.room-scout .stars{color:var(--gold);white-space:nowrap}
.room-scout .depth{font-weight:800;white-space:nowrap}
.room-scout .tier{white-space:normal}

.personnel-choice{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted)}
.personnel-choice select{
  max-width:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:2px;
  padding:3px 6px;
  font-size:12px;
  color:var(--ink);
}
.personnel-choice .detail{flex-basis:100%;margin:0}

.moneyinput{display:flex;align-items:center;justify-content:end;gap:4px}
.moneyinput button{padding:4px 9px;line-height:1.5;border-color:var(--line);background:#fff}
.moneyinput input{
  width:68px;
  text-align:right;
  background:#fff;
  border:1px solid var(--rule);
  border-radius:2px;
  padding:5px 6px;
  font-family:var(--mono);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  appearance:textfield;
  -moz-appearance:textfield;
}
.moneyinput input::-webkit-inner-spin-button,.moneyinput input::-webkit-outer-spin-button{appearance:none;margin:0}
.moneyinput .suffix{font-size:11px;color:var(--muted);font-family:var(--mono)}

.coachoptions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.coachoptions button[aria-pressed=true]{background:var(--rule);color:var(--bg);border-color:var(--rule)}

/* Budget Control */
.budgetline{display:flex;justify-content:space-between;align-items:center;margin:7px 0}
.budgetline span{color:var(--muted);font-size:13px}
.budgetline b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.budgetline.total{border-top:2px solid var(--rule);padding-top:10px;margin-top:10px}
.budgetline.total b{font-size:22px;letter-spacing:0}
.full{width:100%;margin-top:8px}
.notice{font-size:12px;color:var(--muted);margin:8px 0}

/* Conference & School Picker */
.conf-intro{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:14px}
.conf-intro b{color:var(--ink)}
.conf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.conf-card{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  padding:13px;
  min-width:0;
  font-weight:400;
  gap:4px;
  border-radius:2px;
}
.conf-card[aria-pressed=true]{border:2px solid var(--rule);padding:12px;background:var(--panel2)}
.conf-card:disabled{opacity:1;cursor:default}
.conf-card:disabled[aria-pressed=false]{opacity:.55}
.conf-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.conf-top strong{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.conf-check{color:var(--ink);font-size:10px;font-weight:800;text-transform:uppercase}
.conf-level{color:var(--gold);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.conf-desc{font-size:12px;color:var(--muted);min-height:44px}
.conf-facts{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:4px;font-size:11px;margin-top:auto}
.conf-facts>span{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--muted)}
.conf-facts b{color:var(--ink);font-family:var(--mono);white-space:nowrap;font-size:12px}

.school-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:10px 0 16px}
.school-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:9px 6px;
  min-height:40px;
  font-size:12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:2px;
}
.school-btn[aria-pressed=true]{background:var(--rule);color:var(--bg);border-color:var(--rule);font-weight:800}
.school-dot{
  width:8px;height:8px;border-radius:50%;flex:0 0 8px;
  background:linear-gradient(135deg,var(--school1) 50%,var(--school2) 50%);
  box-shadow:0 0 0 1px #16161440;
}
.school-btn[aria-pressed=true] .school-dot{box-shadow:0 0 0 1px #ffffffaa}
.chosen-program{border-top:1px solid var(--rule);padding-top:14px;margin-top:12px}

.outlook-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 16px}
.outlook-grid .metric{background:var(--panel2);border:1px solid var(--line);padding:10px 12px}
.outlook-grid .metric b{font-size:24px}
.outlook-odds{display:grid;gap:8px;margin:10px 0}
.outlook-odds>div{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.outlook-odds b{text-align:right;font-family:var(--mono)}

/* Schedule & Games */
.schedule{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opp{padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:12px}
.opp b{display:block}
.opp small{color:var(--muted)}
.opp.rival,.game.rival{border-left:3px solid var(--gold);background:#fbf6ea;padding-left:9px}
.rival-pill{color:var(--bg);background:var(--gold);border:1px solid var(--gold);margin-left:5px;font-size:9px;vertical-align:middle;padding:1px 5px}
.rival-report{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.rival-report h3{margin-bottom:8px}

details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
summary{cursor:pointer;font-weight:750;color:var(--ink);font-size:13px}
details p,details ul{font-size:13px;color:var(--muted);margin-top:8px}

/* Results & Reports */
.resultbanner{
  padding:20px 22px;
  background:var(--panel2);
  border-top:4px solid var(--rule);
  border-bottom:2px solid var(--rule);
  border-radius:0;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
}
.record{font-size:clamp(60px,10vw,104px);color:var(--ink);letter-spacing:.01em}
.resultbanner h2{margin:6px 0}
.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}

.luckrow{display:grid;grid-template-columns:155px 1fr 66px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.luckrail{height:8px;position:relative;background:var(--line);border-radius:0}
.luckrail:after{content:"";position:absolute;left:50%;height:12px;top:-2px;border-left:1px solid var(--rule)}
.luckrail i{position:absolute;height:8px;top:0;border-radius:0}
.luckrow strong{text-align:right;font-family:var(--mono)}

.ratingrow{display:grid;grid-template-columns:minmax(100px,1fr) minmax(45px,.7fr) 38px 62px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}
.ratingrow b{text-align:right;font-family:var(--mono)}
.ratingrow .bar{height:6px}
.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}

.game{display:grid;grid-template-columns:37px 1fr 80px 28px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.game b{text-align:right;font-family:var(--mono)}
.game small{color:var(--muted);display:block}

.hist{width:100%;border-collapse:collapse;font-size:12px}
.hist th,.hist td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.6px;border-bottom:2px solid var(--rule)}
.hist td:nth-child(2),.hist td:nth-child(3){white-space:nowrap;font-family:var(--mono)}

.dist{display:flex;align-items:end;height:105px;gap:4px;margin:18px 0 5px}
.dist>div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:end;min-width:0}
.dist i{width:85%;background:#8f8a7e;border-radius:0;min-height:0}
.dist i.actual{background:var(--gold)}
.dist small,.dist b{font-size:10px;color:var(--muted);font-family:var(--mono)}
.dist small{margin-top:4px}

.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.compare div{border:1px solid var(--line);background:#fff;padding:11px;border-radius:2px}
.compare b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}

/* Dynasty Finale */
.dynasty-finale{background:var(--panel2);border-top:4px solid var(--rule);border-bottom:2px solid var(--rule);padding:24px;margin-bottom:22px}
.dynasty-finale.legend{border-top-color:var(--gold)}
.dynasty-finale.struggle{border-top-color:var(--red)}
.legacy-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0}
.legacy-heading h2{font-size:clamp(34px,5.5vw,64px);line-height:1;color:var(--ink)}
.legend .legacy-heading h2,.legend .legacy-grade b{color:var(--gold)}
.struggle .legacy-heading h2,.struggle .legacy-grade b{color:var(--red)}
.legacy-grade{text-align:center;min-width:88px;border:2px solid var(--rule);background:var(--bg);padding:8px 14px;border-radius:2px}
.legacy-grade span{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800}
.legacy-grade b{display:block;font-family:var(--display);font-size:clamp(40px,6vw,64px);line-height:1;color:var(--ink)}
.legacy-story{max-width:780px;margin:0 0 20px;font-size:16px;line-height:1.6}
.legacy-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid var(--rule);margin:0 0 20px}
.legacy-stats .metric b{font-size:24px}
.legacy-management{margin-top:8px;line-height:1.6}

/* Share bar & Footer */
.sharebar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:2px}
.sharebar .sharetitle{font-size:13px;font-weight:800;margin-right:auto}
.sharebar .sharestatus{flex-basis:100%;font-size:12px;color:var(--muted)}
.sharebar .sharestatus:empty{display:none}
.sharebar button{font-size:12px;padding:7px 12px;background:#fff}
.dynasty-finale .sharebar{margin-top:18px;margin-bottom:0;background:var(--bg)}

.foot{font-size:12px;color:var(--muted);padding:16px 0;border-top:2px solid var(--rule);margin-top:24px}
.hidden{display:none!important}

/* Override inline dark modal styling */
dialog{background:var(--bg)!important;color:var(--ink)!important;border:2px solid var(--rule)!important;border-radius:2px!important}
dialog::backdrop{background:#16161488}

/* Mobile & Sticky Bottom Budget Bar */
@media(max-width:800px){
  .wrap{padding-left:14px;padding-right:14px}
  .layout{grid-template-columns:1fr;gap:0}

function row(g,i){let c=state.ctx,[label,klass]=marketLabel(i),old=c.returning?.[i];let detail=i===0&&c.coach?`Returning coach · ${Math.round(c.coach.quality)}/100 · market value ${fmt(c.coach.ask)}`:old?`${Math.round(old.share*100)}% eligible to return · ${Math.round(old.talent)}/100 talent · ${fmt(old.ask)} retention ask${old.portal!==undefined?' · portal attrition '+pct(old.portal):''}`:g.desc;return `<div class="alloc"><div><div class="pos">${g.name}<span class="scheme-pill" id="priority-${i}" ${isPriority(i)?'':'hidden'} title="Premium position for your selected scheme">SCHEME</span></div><div class="detail">${detail}</div><div class="room-scout" id="scout-${i}" aria-live="polite"></div>${i?`<div class="detail">Playing-time competition: ${snapLabel(i)}</div>`:''}${old&&i?`<div class="personnel-choice"><label for="personnel-${i}">Room strategy</label><select id="personnel-${i}" aria-label="${g.name} room strategy">${Object.entries(PERSONNEL).map(([k,v])=>`<option value="${k}" ${personnelChoice(c,i)===k?'selected':''}>${v}</option>`).join('')}</select><div class="detail" id="personnel-note-${i}"></div></div>`:''}</div><div class="market ${klass}"><span class="market-pill">${label}</span><small>${Math.round((c.market[i].price-1)*100)>=0?'+':''}${Math.round((c.market[i].price-1)*100)}% market price</small>${old?`<small id="ret-${i}"></small>`:''}</div><div class="moneyinput"><button data-adj="${i},-1" ${i===0&&lockedSalary()!==null?'disabled':''} aria-label="Decrease ${g.name}">−</button><input id="a-${i}" type="number" ${i===0&&lockedSalary()!==null?'disabled':''} min="${i===0?minSalary():0}" max="${i===0?Math.min(funds(),maxSalary()):funds()}" step="0.25" value="${state.alloc[i].toFixed(2)}" aria-label="${g.name} allocation in millions"><button data-adj="${i},1" ${i===0&&lockedSalary()!==null?'disabled':''} aria-label="Increase ${g.name}">+</button><span class="suffix">M</span></div><div class="spendbar" role="img" id="share-${i}" aria-label="Share of available budget (full bar at 25%)"><i id="spend-${i}"></i></div></div>`;}
function confidenceLabel(v){return v>=80?'Strong':v>=60?'Stable':v>=40?'Wavering':'Fragile';}
function confidenceReport(c){let v=c.donorConfidence??70;return `<div class="budgetline"><span>Donor confidence · ${confidenceLabel(v)}</span><b class="${v<40?'danger':v<60?'gold':'positive'}">${Math.round(v)}/100</b></div><p class="notice">${v<55?`Lingering donor distrust and recruiting premiums make recovery harder. Only improved results rebuild confidence.`:'Confidence changes gradually; a coaching change does not erase past disappointments.'}${c.earnedTarget?` Recent success still shapes expectations.`:''}</p>`;}
function fanPanel(c){let f=finances(c,state.choice),p=c.fanPressure??15;return `<section class="section fanpanel">${head('Fan pressure & coaching hot seat','Fans expect at least '+expectation(c)+' regular-season wins. Rivalry results also matter.') }<div class="pressurelabel ${fanTone(p)}">${hotSeat(p)} · ${Math.round(p)}/100</div><div class="pressurebar"><i style="width:${p}%;background:${p>=60?'var(--red)':p>=40?'var(--gold)':'var(--green)'}"></i></div>${confidenceReport(c)}${f.ticketPressure?`<p class="notice ${f.ticketPressure>0?'gold':'positive'}">Ticket pricing: ${signed(f.ticketPressure)} opening fan pressure points.</p>`:''}${f.newNaming?`<p class="notice gold">Proposed naming sale: +${NAMING_PRESSURE} pressure; projected opening fan pressure ${Math.round(f.pressure)}/100 after all offseason decisions.</p>`:''}${c.rivalry?.games?.length?`<p class="notice">Last season's rivalries: ${c.rivalry.wins}–${c.rivalry.losses} · ${signed(c.rivalry.pressure)} fan pressure points.</p>`:''}${c.fanPenalty?`<p class="notice danger">Last season’s fan backlash cut gross revenue by ${(c.fanPenalty*100).toFixed(1)}% before the floor.</p>`:''}${c.coach?`<p class="notice">${yearsLeft(c.coach)>0?`Coach in year ${c.coach.tenure}; keeping a struggling coach risks further donor losses. Firing resets some pressure but triggers a buyout on the remaining guaranteed contract.`:`The coaching contract has expired. You can offer a new deal or hire a replacement with no new buyout.`}</p><div class="budgetline"><span>If replaced: total buyout</span><b>${fmt(finances(c,'hire').totalBuyout)}</b></div><div class="budgetline"><span>Potential fan enthusiasm offset (year 1)</span><b class="positive">${fmt(finances(c,'hire').relief)}</b></div>${f.fire?`<p class="notice positive">Projected pressure after firing: ${Math.round(f.pressure)}/100 (${hotSeat(f.pressure)}). The hire is not final until you play.</p>`:''}`:`<p class="notice">${c.coachEvent||'A new program gets a little patience. Expectations rise as prestige and revenue grow.'}</p>`}${(c.buyouts||[]).some(Boolean)?`<p class="notice gold">Existing buyout schedule: ${c.buyouts.map((v,i)=>calendarYear(c.year+i)+': '+fmt(v)).join(' · ')}</p>`:''}</section>`;}
function conferenceOutlook(c){let l=league(c),strength=sos(c),last=state.history.at(-1),atLarge=w=>atLargeOdds(c,w);let outlook=last?`Last season: ${last.reg}–${12-last.reg} regular season · ${last.outcome}.`:'';return `<section class="section">${head((c.school||l.name)+' program outlook',calendarYear(c.year)+' · Year '+c.year+' of 10 · '+l.name+' · Program locked')}<p class="conf-intro">${l.desc} ${outlook}</p><div class="outlook-grid">${metric('Schedule strength',strength.toFixed(1)+'/100','Higher means tougher games')}${metric('Playoff field','24 teams','Top 8 earn a bye')}${metric('Fan win target',expectation(c),'Regular-season wins')}${metric('Gross revenue ceiling',fmt(l.ceiling),'Floor: '+fmt(l.floor))}</div><h3>Rivalries this season</h3><p class="notice">${rivalryList(c)}. Rivalry results have an additional effect on fan pressure and donor support.</p><h3>Road to the playoff</h3><p class="notice">At-large qualification odds at each regular-season record, if you do not win the conference:</p><div class="outlook-odds">${[7,8,9,10,11].map(w=>`<div><span>${w}–${12-w}</span><div class="bar"><i style="width:${atLarge(w)*100}%"></i></div><b>${pct(atLarge(w))}</b></div>`).join('')}</div><p class="notice">Conference titles are decided by regular-season standings (with simulated tiebreaks), not a championship game. Champions qualify automatically. Top-eight seeds earn a bye; seeds 9–16 host round one. A 9–3 team rarely earns a bye; eight-win teams cannot earn one in this model. National playoff opponents use the same seed-based difficulty scale across conferences. Odds reflect this year's schedule and the game's assumptions.</p></section>`;}
function conferencePanel(c){if(programLocked())return conferenceOutlook(c);let selected=browseConference||c.conference,dynasty=state.mode==='dynasty',labels={SEC:'Hardest road',BIG10:'High difficulty',ACC:'More favorable road',BIG12:'More favorable road'};let cards=Object.entries(CONFERENCES).map(([k,v])=>`<button type="button" class="conf-card" data-conf="${k}" aria-pressed="${selected===k}"><span class="conf-top"><strong>${v.name}</strong><span class="conf-check">${selected===k?'✓ Browsing':''}</span></span><span class="conf-level">${labels[k]}</span><span class="conf-desc">${v.desc}</span>${dynasty?`<span class="conf-facts"><span>Revenue ceiling <b>${fmt(v.ceiling)}</b></span></span>`:''}</button>`).join('');let schools=Object.keys(SCHOOLS[selected]).sort().map(n=>`<button type="button" class="school-btn" data-school="${n}" data-school-conf="${selected}" aria-pressed="${n===c.school&&selected===c.conference}">${schoolDot(n)}<span>${n}</span></button>`).join('');let preview=c.school?`<div class="chosen-program"><h3>${c.school} · ${league(c).name}</h3><div class="outlook-grid">${metric('Starting budget',fmt(c.budget))}${metric('Schedule strength',sos(c).toFixed(1)+'/100')}${metric('Fan win target',expectation(c),'Regular-season wins')}${metric('8–4 at-large odds',pct(atLargeOdds(c,8)),'Without a league title')}${dynasty?metric('Gross revenue ceiling',fmt(league(c).ceiling),'Floor: '+fmt(league(c).floor)):''}</div><p class="notice"><b>Rivalries this season:</b> ${rivalryList(c)}.</p></div>`:'<p class="notice gold">Select a school to reveal your program outlook and unlock season play.</p>';return `<section class="section">${head('Choose your program','Browse a conference, then select a school. Every school starts with $50M and equal starting prestige.') }<div class="conf-grid">${cards}</div><p class="notice">SEC and Big Ten schedules are generally tougher, with stronger at-large prospects and higher revenue limits. ACC and Big 12 offer a more favorable weekly schedule. Fan expectations depend on the school.</p><h3 style="margin-top:16px">${CONFERENCES[selected].name} programs</h3><div class="school-grid">${schools}</div>${preview}<p class="notice">School choice fixes your conference in Dynasty. Schools have different fan expectations, schedules and rivalries, but no hidden starting talent or recruiting advantage. All ratings and expectations are modeled.</p></section>`;}

function contractPanel(c){let old=c.coach,left=yearsLeft(old),locked=lockedSalary(),f=finances(c,state.choice),min=minimumTerm(c,state.choice);return `<div class="coachoptions">${old?`<button class="small" data-coach="retain" aria-pressed="${state.choice==='retain'}">${left?'Keep contract':'Re-sign coach'}</button>${left?`<button class="small" data-coach="extend" aria-pressed="${state.choice==='extend'}">Extend / raise</button>`:''}<button class="small" data-coach="hire" aria-pressed="${state.choice==='hire'}">${left?'Fire & replace':'Hire replacement'}</button>`:''}</div>${old?`<p class="notice">${left?`${left} season(s) remaining at ${fmt(old.salary)} per year. Current market value: ${fmt(old.ask)}.`:`Contract expired · Previous salary ${fmt(old.salary)} · Estimated market value ${fmt(old.ask)}. Make a renewal offer or hire a replacement without a buyout.`}</p>`:c.coachEvent?`<p class="notice gold">${c.coachEvent}</p>`:''}${locked===null?`<div class="field"><label for="contractYears">${state.choice==='extend'?'New total term from this season':'Contract length (3–7 years)'}</label><select id="contractYears">${Array.from({length:8-min},(_,i)=>i+min).map(y=>`<option value="${y}" ${y===proposedTerm(c,state.choice)?'selected':''}>${y} year${y===1?'':'s'}</option>`).join('')}</select></div>`:''}<div id="renewalOdds" aria-live="polite"></div><p class="notice" id="coachnote"></p>${f.fire?`<p class="notice gold">Total buyout ${fmt(f.totalBuyout)} · ${f.parts.map((v,i)=>calendarYear(c.year+i)+': '+fmt(v)).join(' · ')} · First-year donor offset ${fmt(f.relief)}</p>`:''}`;}
function schemePanel(side){let key=state[side],ctx=state.ctx,t=schemeTransition(ctx,side,key),dict=side==='off'?OFF:DEF;let names=PRIORITY[side][key].map(i=>GROUPS[i].id).join(' · ');return `<p><b class="positive">Premium rooms:</b> ${names}</p>${ctx.returning?`<div class="scheme-impact"><div class="tag">Previous system</div><b>${dict[t.prior][0]} · ${mastery(t.oldYears)} (Year ${t.oldYears}${t.oldYears===5?'+':''})</b><div class="tag" style="margin-top:8px">Next season</div><b class="${t.level>=3?'danger':t.level?'gold':'positive'}">${CHANGE_LABEL[t.level]} · ${mastery(t.years)}${t.years>1?' (Year '+t.years+(t.years===5?'+':'')+')':''}</b>${t.level?`<p>Opening-week execution: −${t.execution} OVR, easing during the season.<br>Returning talent effectiveness: −${Math.round(t.fit*100)}%.<br>Retention probability: −${Math.round(t.retention*100)} percentage points.</p>`:'<p>Preserves accumulated system mastery. No transition penalty.</p>'}</div>`:'<p>First-year installation. No inherited system mismatch.</p>'}`;}
function schemeFit(roster,side){let ids=PRIORITY[side][roster[side]],score=mean(ids.map(i=>roster.rooms[i].talent));return {score,grade:depthGrade(score),weak:ids.reduce((a,i)=>roster.rooms[i].talent<roster.rooms[a].talent?i:a,ids[0])};}
function transitionCost(ctx,roster,side){let t=roster.transition?.[side];if(!t?.level)return 0;let clean={...roster,transition:{...roster.transition,[side]:{...t,level:0,fit:0,execution:0}}};return sum(ctx.schedule.map((op,i)=>winProb(matchup(clean,op,{},0,0,i+1).margin)-winProb(matchup(roster,op,{},0,0,i+1).margin)));}
function schemeReport(ctx,roster){return `<section class="section">${head('Personnel & scheme fit','Priority-room talent grades and the direct on-field cost of changing systems.')}<div class="schemes">${['off','def'].map(side=>{let f=schemeFit(roster,side),t=roster.transition?.[side],dict=side==='off'?OFF:DEF;return `<div class="scheme-impact"><div class="tag">${side==='off'?'Offensive':'Defensive'} philosophy</div><h3>${dict[roster[side]][0]} · <span class="${f.score>=80?'positive':f.score<65?'danger':'gold'}">${f.grade}</span></h3><p class="notice">Priority-room average ${Math.round(f.score)} OVR. Weakest priority room: ${GROUPS[f.weak].name} (${Math.round(roster.rooms[f.weak].talent)} OVR).</p>${t?`<p class="notice">${mastery(t.years)} · ${CHANGE_LABEL[t.level]}.</p>${t.level?`<p class="gold">Direct transition cost: ${Math.max(0,transitionCost(ctx,roster,side)).toFixed(2)} expected regular-season wins.</p>`:''}`:''}</div>`}).join('')}</div><p class="notice">Transition cost compares this acquired roster with and without that side's execution and personnel-fit penalties; it excludes extra departures and lost mastery.</p></section>`;}
function financeReport(next){let f=next.finance||{};if(!f.reserveIn&&!f.reserveOut&&!f.naming&&!f.ticket&&!f.upgradeSpend&&!f.upgradeIncome&&!f.ticketPressure&&next.upgradeYear==null)return '';return `<section class="section">${head('Financial decisions · season review')} ${f.naming?`<div class="budgetline"><span>Naming rights revenue</span><b class="positive">+${fmt(f.naming)}</b></div>`:''}${f.newNaming?`<p class="notice gold">Sale completed: +${NAMING_PRESSURE} starting fan pressure; −${NAMING_CONFIDENCE} initial donor confidence. The annual $1M continues.</p>`:''}${f.ticketPressure?`<div class="budgetline"><span>${TICKET_POLICIES[f.ticketPolicy].label} · ticket revenue</span><b class="${f.ticket>=0?'positive':'danger'}">${f.ticket>=0?'+':'−'}${fmt(Math.abs(f.ticket))}</b></div><p class="notice">Opening fan pressure ${signed(f.ticketPressure)} points.</p>`:''}${f.upgradeSpend?`<div class="budgetline"><span>Stadium upgrade investment</span><b class="danger">−${fmt(f.upgradeSpend)}</b></div>`:''}${f.upgradeIncome?`<div class="budgetline"><span>Stadium upgrade revenue</span><b class="positive">+${fmt(f.upgradeIncome)}</b></div>`:''}${next.upgradeYear!=null&&!f.upgradeIncome?`<p class="notice">Stadium upgrades: additional revenue begins ${calendarYear(next.upgradeYear+UPGRADE_DELAY)}.</p>`:''}${f.reserveIn?`<div class="budgetline"><span>Prior reserve used this season</span><b>${fmt(f.reserveIn)}</b></div>`:''}${f.reserveOut?`<div class="budgetline"><span>${next.gm?.fired?'Reserve forfeited to successor':'Reserve available next year'}</span><b>${fmt(f.reserveOut)}</b></div>`:''}${next.reserveBacklash?`<p class="notice danger">Conservation while missing expectations caused +${next.reserveBacklash} additional fan pressure and reduced donor confidence.</p>`:''}</section>`;}
function financialPanel(c){let f=finances(c,state.choice),limit=reserveLimit(c,state.choice),risk=f.reserveOut/Math.max(1,ordinaryRevenue(c)),warning=risk>=.15?'Aggressive conservation: substantial current-season risk.':risk>=.08?'Significant conservation: a weaker roster may miss expectations.':risk>0?'Modest conservation: less money for this year’s team.':'Full investment in the current season.';return `<section class="section">${head('Program finances','Optional long-term decisions · Dynasty only. Changing a financial option refits your allocations to the new budget; review before playing.')}<div class="schemes"><div class="field"><h3>Strategic reserve</h3><p class="notice">Set aside up to 20% of ordinary annual revenue. Every dollar saved reduces this year’s roster budget by a dollar. Funds must be used next season; no interest or permanent revenue increase.</p>${f.reserveIn?`<div class="budgetline"><span>Reserve from last year (spend now)</span><b class="positive">+${fmt(f.reserveIn)}</b></div>`:''}${c.year<10?`<label for="reserveOut">Set aside for ${calendarYear(c.year+1)}</label><div class="moneyinput reserveinput"><button type="button" data-reserve-adj="-1" ${f.reserveOut<=0?'disabled':''} aria-label="Decrease strategic reserve">−</button><input type="number" id="reserveOut" min="0" max="${limit}" step="0.25" value="${f.reserveOut.toFixed(2)}" aria-label="Reserve in millions"><button type="button" data-reserve-adj="1" ${f.reserveOut>=limit?'disabled':''} aria-label="Increase strategic reserve">+</button><span class="suffix">M</span></div><p class="notice">Maximum ${fmt(limit)} · Fan and board win targets do not fall when you save.</p><p class="notice ${risk>=.15?'danger':risk>=.08?'gold':''}">${warning}</p>${risk>0&&(c.gm?.pressure||0)>=60?'<p class="notice danger">You may not be employed next year to spend these funds.</p>':''}`:'<p class="notice">Final season: reserves cannot be carried beyond your tenure.</p>'}</div><div class="field"><h3>Stadium naming rights</h3><p class="notice">Sell once for +$1M every season, including this one. The sale permanently relinquishes naming rights; fans dislike the commercialization.</p>${c.namingSold?'<p class="positive">Sold · +$1M annually</p>':`<button type="button" class="small full" id="namingToggle" aria-pressed="${!!c.namingPending}">${c.namingPending?'Cancel proposed sale':'Sell naming rights'}</button><p class="notice ${c.namingPending?'danger':'gold'}">${c.namingPending?'Sale pending: locks when you play.':'One-time cost:'} +${NAMING_PRESSURE} fan pressure, −${NAMING_CONFIDENCE} donor confidence. No repeat sales.</p>`}</div><div class="field"><h3>Ticket pricing</h3><p class="notice">Set your annual policy. Higher prices raise revenue but strain fan support; weak demand reduces the proceeds. Your policy continues until changed (fan-friendly pricing reverts to standard if contractual obligations make it unaffordable).</p><label for="ticketPolicy">Annual ticket policy</label><select id="ticketPolicy">${Object.entries(TICKET_POLICIES).map(([k,p])=>`<option value="${k}" ${ticketPolicy(c)===k?'selected':''}>${p.label}</option>`).join('')}</select><div class="budgetline"><span>Revenue this season</span><b class="${f.ticket<0?'danger':f.ticket>0?'positive':''}">${f.ticket<0?'−':f.ticket>0?'+':''}${fmt(Math.abs(f.ticket))}</b></div><div class="budgetline"><span>Opening fan pressure</span><b class="${f.ticketPressure>0?'danger':f.ticketPressure<0?'positive':''}">${signed(f.ticketPressure)} pts</b></div><p class="notice">Premium pricing: up to $1.5M (+8 pressure). Maximum: up to $3M (+18). Fan-friendly: −$1.5M (−10 pressure).</p></div><div class="field"><h3>Stadium upgrades</h3><p class="notice">Invest $7M now for improved stadium facilities. No additional revenue for two seasons; then +$2.5M annually. One project per dynasty.</p>${c.upgradeYear!=null?(f.upgradeIncome?'<p class="positive">Complete · +$2.5M annually</p>':`<p class="gold">Under construction · revenue begins ${calendarYear(c.upgradeYear+UPGRADE_DELAY)}</p>`):c.year>10-UPGRADE_DELAY?'<p class="notice">Too late to finish the project within this dynasty.</p>':`<button type="button" class="small full" id="upgradeToggle" aria-pressed="${!!c.upgradePending}" ${!upgradeAllowed(c,state.choice)?'disabled':''}>${c.upgradePending?'Cancel proposed upgrades':'Invest $7M in stadium upgrades'}</button><p class="notice ${c.upgradePending?'gold':''}">${c.upgradePending?'Investment pending: locks when you play. ':''}Revenue begins ${calendarYear(c.year+UPGRADE_DELAY)}. ${fmt((11-c.year-UPGRADE_DELAY)*UPGRADE_REVENUE)} in potential receipts through 2036.${!upgradeAllowed(c,state.choice)?' Insufficient current-year revenue after obligations.':''}</p>`}</div></div><div class="budgetline"><span>Available this season after obligations and reserve</span><b>${fmt(f.available)}</b></div></section>`;}
function build(){let c=state.ctx,old=c.coach;if(!hasProgram())return conferencePanel(c);return `<div class="layout"><div>${conferencePanel(c)}${state.mode==='dynasty'?`<div class="pressure-grid">${fanPanel(c)}${gmPanel(c.gm)}</div>${financialPanel(c)}`:''}<section class="section">${head('Football identity','Choose your scheme before buying talent. The same roster can perform differently in different systems.')}<div class="schemes"><div class="field"><label for="off">Offensive philosophy</label><select id="off">${Object.entries(OFF).map(([k,v])=>`<option value="${k}" ${state.off===k?'selected':''}>${v[0]}</option>`).join('')}</select><p id="offdesc">${OFF[state.off][1]}</p><div id="offimpact">${schemePanel('off')}</div></div><div class="field"><label for="def">Defensive philosophy</label><select id="def">${Object.entries(DEF).map(([k,v])=>`<option value="${k}" ${state.def===k?'selected':''}>${v[0]}</option>`).join('')}</select><p id="defdesc">${DEF[state.def][1]}</p><div id="defimpact">${schemePanel('def')}</div></div></div></section><section class="section">${head('Allocate your capital','Amounts in millions of dollars. Market prices vary by year; spending covers the entire room, including returning players. OVR, stars and depth are live scouting projections, not guarantees.')}<div class="preset">${[['balanced','Balanced'],['trenches','Trenches first'],['air','Air power'],['defense','Defense first'],['zero','Clear']].map(([k,v])=>`<button class="small" data-preset="${k}">${v}</button>`).join('')}</div>${GROUPS.map((g,i)=>(i===0||g.section!==GROUPS[i-1].section?`<div class="grouphead">${g.section}<span id="section-${g.section.replaceAll(' ','-')}"></span></div>`:'')+row(g,i)+(i===0?contractPanel(c):'') ).join('')}<details><summary>How to interpret the market</summary><p>A deep market stretches each dollar; a scarce market reduces purchasing power. Prices are relative to the typical market, not exact quotes. Retention asks cover eligible returning talent; falling short risks losing it. Retain prioritizes continuity; Reinforce (default) balances returning talent with upgrades; Rebuild replaces eligible returning talent with new acquisitions, at higher uncertainty and lower experience. Money left after retention buys newcomers and depth. Elite backups at positions with scarce playing time are harder to recruit and retain, even with high spending. National compensation rises 1.8% per season in this model; prestige offers only a modest discount.</p></details></section><section class="section">${head('Preseason schedule',programName(c)+' · '+c.schedule.filter(o=>o.conf).length+' league games · '+(PUBLISHED_HOME[c.conference]?.[c.year]?.[c.school]&&(c.conference!=='SEC'||c.year<=3)?'Published league opponents; dates/order and nonconference slate modeled.':'Modeled rotation and nonconference slate.'))}<div class="schedule">${c.schedule.map((o,i)=>`<div class="opp${o.rivalry||o.rivalWeight?' rival':''}"><b>W${i+1} · ${o.name}${o.rivalry||o.rivalWeight?`<span class="rival-pill" title="${rivalryLabel(o.rivalWeight||1)}">RIVALRY</span>`:''}</b><small>${o.home===1?'Home':o.home===-1?'Away':'Neutral'} · ${o.conf?league(c).name:'Nonconference'} · ${Math.round(mean([o.op,o.or,o.dp,o.dr]))}/100</small><br><small>${o.style} / ${o.defstyle}</small></div>`).join('')}</div></section></div><aside class="sidebar"><section class="section">${head('Budget control')}<div class="budgetline"><span>Base annual revenue</span><b>${fmt(c.budget)}</b></div>${(()=>{let f=finances(c,state.choice);return `${f.naming?`<div class="budgetline"><span>Stadium naming rights</span><b class="positive">+${fmt(f.naming)}</b></div>`:''}${f.ticket?`<div class="budgetline"><span>Ticket pricing</span><b class="${f.ticket>0?'positive':'danger'}">${f.ticket>0?'+':'−'}${fmt(Math.abs(f.ticket))}</b></div>`:''}${f.upgradeIncome?`<div class="budgetline"><span>Stadium upgrade revenue</span><b class="positive">+${fmt(f.upgradeIncome)}</b></div>`:''}${f.upgradeSpend?`<div class="budgetl function dynastyGrade(h){
 const titles=h.filter(x=>x.champ).length,playoffs=h.filter(x=>x.playoff).length,leagueTitles=h.filter(x=>x.confTitle).length,regWins=sum(h.map(x=>x.reg)),tenWins=h.filter(x=>x.reg>=10).length,losing=h.filter(x=>x.reg<6).length;
 if(titles>=4||(titles>=3&&playoffs>=8))return {grade:'S',tier:'GOAT',tone:'legend',story:'You didn’t just build a championship program. You defined an era. The rest of college football spent the decade trying to catch you; your legacy belongs in the conversation with the greatest to ever do it.'};
 if(titles>=2)return {grade:'A+',tier:'Dynasty builder',tone:'legend',story:'One championship can come from a magical season. Multiple championships are a legacy. You built a program capable of reaching the summit more than once.'};
 if(titles===1&&playoffs>=7)return {grade:'A+',tier:'National powerhouse',tone:'legend',story:'You captured a national championship and kept your program in the national conversation year after year. Your team became a fixture on the biggest stage.'};
 if(titles===1)return {grade:'A',tier:'National champion',tone:'strong',story:'You delivered the ultimate prize. A national championship banner will hang forever, even if the rest of the decade did not always match that extraordinary season.'};
 if(playoffs>=7&&regWins>=85)return {grade:'A−',tier:'Perennial contender',tone:'strong',story:'You built a team nobody wanted to face in December. The national title proved elusive, but sustained relevance is an achievement few programs can match.'};
 if(playoffs>=4||regWins>=80)return {grade:'B',tier:'Respectable program',tone:'solid',story:'You built a credible winner, with enough good seasons to keep supporters engaged. The next step is turning competitiveness into genuine championship contention.'};
 if(playoffs>=2||regWins>=65)return {grade:'C',tier:'Middle of the pack',tone:'solid',story:'There were moments of promise, but the program never established itself as a consistent threat. After a decade, fans are still waiting for the breakthrough.'};
 if(regWins>=50)return {grade:'D',tier:'Hot seat regular',tone:'struggle',story:'A decade of uneven football has worn down the fan base. Too many seasons ended with disappointment, and the program needs a different approach to roster construction.'};
 return {grade:'F',tier:'Program in ruins',tone:'struggle',story:'Ten years, countless allocation decisions, and little to show for them. The championship window never opened. The next administration has a major rebuilding job on its hands.'};
}

function dismissalStory(h){let titles=h.filter(x=>x.champ).length;return titles?'You reached the summit, but past championships could not shield you from the board’s concerns. Your tenure ends with your accomplishments intact.':'The university has lost confidence in your leadership. Sustained performance, rivalry results and financial stewardship matter as much as individual coaching decisions. The board has decided to move in a different direction.';}
function dynastySummary(){
 let h=state.history,t=h.filter(x=>x.champ).length,p=h.filter(x=>x.playoff).length,cc=h.filter(x=>x.confTitle).length,w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),cost=sum(h.map(x=>x.budget)),reg=sum(h.map(x=>x.reg)),ten=h.filter(x=>x.reg>=10).length,losing=h.filter(x=>x.reg<6).length,grade=dynastyGrade(h),first=h[0].gross??h[0].budget,last=h.at(-1).gross??h.at(-1).budget,change=last-first,pressure=state.result?.next?.fanPressure??h.at(-1).fanPressure??15,obligations=sum(state.result?.next?.buyouts||[]),finance=change>=5?'The program expanded its financial resources over the decade.':change<=-5?'The program finishes with a smaller revenue base than it started with.':'The program broadly preserved its starting revenue base.',fans=pressure>=60?'Fan patience is wearing thin.':pressure>=35?'The fan base remains uneasy.':'Fan pressure is low at the close of your tenure.';
 return `<section class="section dynasty-finale ${grade.tone}"><div class="eyebrow">2027–2036 · ${programName(state.ctx)} · Final legacy assessment</div><div class="legacy-heading"><div><div class="tag">Your legacy</div><h2>${grade.tier}</h2></div><div class="legacy-grade"><span>FINAL GRADE</span><b>${grade.grade}</b></div></div><p class="legacy-story">${grade.story}</p><div class="metrics">${metric('National titles',t,'Across ten seasons')}${metric('Career record',w+'–'+l,((w/(w+l))*100).toFixed(1)+'% win rate')}${metric('Playoff appearances',p+'/10')}${metric('Conference titles',cc)}</div><div class="legacy-stats">${metric('Regular-season wins',reg+'/120')}${metric('10-win regular seasons',ten+'/10')}${metric('Losing regular seasons',losing+'/10')}${metric('Final gross revenue',fmt(last),(change>=0?'+':'−')+fmt(Math.abs(change))+' vs. Year 1')}</div><h3>Program you leave behind</h3><p class="legacy-management">${finance} ${fans} ${obligations>0?fmt(obligations)+' in coaching buyouts remains payable after your final season.':'No outstanding coaching buyouts remain.'}</p><p class="notice">Average annual football allocation ${fmt(cost/h.length)} · ${fmt(cost/Math.max(1,w))} allocated per total win · Final fan pressure ${Math.round(pressure)}/100.</p>${h.some(x=>x.auto)?`<p class="notice">${h.filter(x=>!x.auto).length} manually managed seasons · ${h.filter(x=>x.auto).length} automatically simulated seasons.</p>`:''}${shareBar('dynasty')}<details><summary>How your legacy is graded</summary><p>Championships carry the most weight, followed by sustained playoff contention and regular-season wins. The financial and fan assessment describes the program you leave behind; it does not independently add points or reward spending more money. The grade is based on actual results, not simulated title odds.</p><ul><li>S · GOAT: 4+ titles, or 3+ titles and at least 8 playoff appearances.</li><li>A+ · Dynasty builder: 2+ titles (below GOAT).</li><li>A+ · National powerhouse: 1 title and 7+ playoff appearances.</li><li>A · National champion: 1 title.</li><li>A− · Perennial contender: no titles, 7+ playoff appearances and 85+ regular-season wins.</li><li>B · Respectable program: 4+ playoff appearances or 80+ regular-season wins.</li><li>C · Middle of the pack: 2+ playoff appearances or 65+ regular-season wins.</li><li>D · Hot seat regular: 50+ regular-season wins.</li><li>F · Program in ruins: fewer than 50 regular-season wins.</li></ul><p>Criteria apply in descending order. All conferences use the same legacy tiers; conference choice already changes competitive conditions.</p></details></section>`;
}

function shareData(kind){const c=state.ctx, s=state.result.s, h=state.history, conf=programName(c), year=calendarYear(c.year);if(kind==='dynasty'&&gmEnded()){let w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),t=h.filter(x=>x.champ).length,p=h.filter(x=>x.playoff).length;return {kind,school:c.school,slug:'dismissed-'+year,sub:`${conf}  /  2027–${year}`,headline:'RELIEVED OF DUTIES',record:`${w}–${l}`,recordLabel:'CAREER RECORD',badge:'FIRED AS GM',gold:false,stats:[['Seasons managed',`${h.length}/10`],['National titles',String(t)],['Playoff appearances',String(p)],['Outstanding buyouts',fmt(sum(state.result.next.buyouts||[]))]],story:dismissalStory(h),text:`SATURDAY GM | ${conf} | 2027–${year}\nFIRED AS GM after ${h.length} seasons\nCareer record: ${w}–${l} | National titles: ${t} | Playoff appearances: ${p}\nHow good is your program?`};}if(kind==='dynasty'){const grade=dynastyGrade(h),titles=h.filter(x=>x.champ).length,playoffs=h.filter(x=>x.playoff).length,cc=h.filter(x=>x.confTitle).length,w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),last=h.at(-1).gross??h.at(-1).budget;return {kind,school:c.school,slug:'dynasty-2027-2036',sub:`${conf}  /  2027–2036${h.some(x=>x.auto)?`  /  ${h.filter(x=>x.auto).length} AUTO`: ''}`,headline:grade.tier.toUpperCase(),record:`${w}–${l}`,recordLabel:'CAREER RECORD',badge:`GRADE ${grade.grade}`,gold:grade.tone==='legend',stats:[['National titles',String(titles)],['Playoff appearances',`${playoffs}/10`],['Conference titles',String(cc)],['Final revenue',fmt(last)]],story:grade.story,text:`SATURDAY GM | Dynasty 2027–2036 (${conf})\n${grade.tier} • Grade ${grade.grade}\nCareer record: ${w}–${l}\nNational titles: ${titles} | Playoffs: ${playoffs}/10 | Conference titles: ${cc}\nFinal annual revenue: ${fmt(last)}${h.some(x=>x.auto)?`\n${h.filter(x=>!x.auto).length} manually managed seasons | ${h.filter(x=>x.auto).length} auto-simulated`: ''}\nHow good is your program?`};}let extras=[['Regular season',`${s.reg}–${12-s.reg}`],['Conference record',`${s.conf}–${(s.leagueGames??c.schedule.filter(g=>g.conf).length)-s.conf}`],['CFP seed',s.cfpSeed?'#'+s.cfpSeed:'—'],['Annual spending',fmt(state.result.spent??sum(state.result.alloc))]];return {kind,school:c.school,slug:'season-'+year,sub:`${conf}  /  ${year} SEASON`,headline:s.outcome.toUpperCase(),record:`${s.wins}–${s.losses}`,recordLabel:'FINAL RECORD',badge:s.champ?'NATIONAL TITLE':s.confTitle?'CONFERENCE TITLE':s.playoff?'PLAYOFF TEAM':'SEASON COMPLETE',gold:!!s.champ,stats:extras,story:s.confTitle?'Conference champions.':s.playoff?'Earned a place in the College Football Playoff.':'',text:`SATURDAY GM | ${year} (${conf})\n${s.wins}–${s.losses} • ${s.outcome}\nRegular season: ${s.reg}–${12-s.reg} | Conference: ${s.conf}–${(s.leagueGames??c.schedule.filter(g=>g.conf).length)-s.conf}${s.confTitle?' • Conference champions':''}${s.cfpSeed?'\nCFP seed: #'+s.cfpSeed:''}\nAnnual spending: ${fmt(state.result.spent??sum(state.result.alloc))}\nHow good is your program?`};}
function makeShareCard(d){let canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;let x=canvas.getContext('2d');let bg=x.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#263e2c');bg.addColorStop(1,'#111c17');x.fillStyle=bg;x.fillRect(0,0,1080,1080);x.strokeStyle='#d2ef9215';x.lineWidth=2;for(let i=0;i<=1080;i+=180){x.beginPath();x.moveTo(i,0);x.lineTo(i,1080);x.stroke();}let accent=d.gold?'#e5be77':'#d2ef92';let colors=SCHOOL_COLORS[d.school];x.fillStyle=colors?colors[0]:accent;x.fillRect(0,0,colors?810:1080,12);if(colors){x.fillStyle=colors[1];x.fillRect(810,0,270,12);}const display='"Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, system-ui, sans-serif';const text=(str,px,xx,yy,col='#f1f1e8',weight=700,max=0,athletic=false)=>{let family=athletic?display:'system-ui, sans-serif';if(athletic)weight=weight>=800?800:700;x.font=`${weight} ${px}px ${family}`;if(max){while(x.measureText(str).width>max&&px>18){px--;x.font=`${weight} ${px}px ${family}`;}}x.fillStyle=col;x.fillText(str,xx,yy);};const line=(y)=>{x.strokeStyle='#a2b3a750';x.beginPath();x.moveTo(65,y);x.lineTo(1015,y);x.stroke();};text('SATURDAY GM',52,65,85,'#d2ef92',800,0,true);text(d.sub,23,65,130,'#a2b3a7',700,950);line(156);text(d.badge,30,65,200,accent,800,950,true);text(d.headline,78,65,278,'#f1f1e8',800,950,true);text(d.recordLabel,22,65,327,'#a2b3a7',750);text(d.record,155,65,462,accent,800,950,true);d.stats.forEach(([label,value],i)=>{let xx=65+(i%2)*485,yy=510+Math.floor(i/2)*142;x.fillStyle='#111c1790';x.fillRect(xx,yy,465,125);text(label.toUpperCase(),20,xx+20,yy+35,'#a2b3a7',750,425);text(value,59,xx+20,yy+92,'#f1f1e8',800,425,true);});let y=825;if(d.story){let words=d.story.split(' '),lineText='';x.font='500 25px system-ui, sans-serif';for(let word of words){let attempt=lineText?lineText+' '+word:word;if(x.measureText(attempt).width>950&&lineText){text(lineText,25,65,y,'#d0dbd2',500);y+=34;lineText=word;}else lineText=attempt;}if(lineText)text(lineText,25,65,y,'#d0dbd2',500);}line(987);text('HOW GOOD IS YOUR PROGRAM?',31,65,1034,accent,800,950,true);return canvas;}
async function shareResult(action,kind,bar){let d=shareData(kind),status=bar.querySelector('.sharestatus');try{if(action==='copy'){let copied=false;try{await navigator.clipboard.writeText(d.text);copied=true;}catch(e){let t=document.createElement('textarea');t.value=d.text;t.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(t);t.select();try{copied=document.execCommand('copy');}finally{t.remove();}}if(!copied){window.prompt('Copy your results:',d.text);status.textContent='Results ready to copy.';}else status.textContent='Results copied. Paste into a message or post.';}else if(action==='native'){await navigator.share({title:'Saturday GM results',text:d.text});status.textContent='';}else if(action==='image'){status.textContent='Preparing result card…';if(document.fonts){await Promise.race([Promise.allSettled([document.fonts.load('800 78px "Barlow Condensed"'),document.fonts.load('700 30px "Barlow Condensed"')]),new Promise(resolve=>setTimeout(resolve,1800))]);}let canvas=makeShareCard(d),a=document.createElement('a');a.download='saturday-gm-'+d.slug+'.png';a.href=canvas.toDataURL('image/png');document.body.append(a);a.click();a.remove();status.textContent='Result card ready. Attach it to a message or social post.';}}catch(e){if(e.name!=='AbortError')status.textContent='Sharing was unavailable. Try Copy results or Download result card.';}}

function render(){let previousBars=Object.fromEntries(Array.from(app.querySelectorAll('#budgetbar,[id^=spend-]')).map(el=>[el.id,{width:el.style.width,background:el.style.background}]));renderHero();app.innerHTML=header()+(state.phase==='build'?build():result())+`<div class="foot">SATURDAY GM · Prototype v1.37 · A fictional football economics simulator. Outcomes reflect illustrative model assumptions, not calibrated predictions or actual NIL prices.</div>`;if(state.phase==='build'&&hasProgram()){for(let [id,v] of Object.entries(previousBars)){let el=document.getElementById(id);if(el){el.style.width=v.width;el.style.background=v.background;}}void app.offsetWidth;updateBudget();}else save();}
function adjustReserve(v,step=0){if(state.mode!=='dynasty'||state.phase!=='build'||state.ctx.year>=10||!hasProgram())return;state.ctx.reserveOut=roundQ(Number.isFinite(v)?v:0);normalizeFinance();state.alloc=fitAlloc(state.alloc,funds());render();if(step){let b=app.querySelector('[data-reserve-adj="'+step+'"]');if(b?.disabled)b=app.querySelector('#reserveOut');b?.focus({preventScroll:true});}}
function adjust(i,v){if(i===0&&lockedSalary()!==null)return;state.alloc[i]=roundQ(clamp(Number.isFinite(v)?v:0,i===0?minSalary():0,i===0?Math.min(funds(),maxSalary()):funds()));document.getElementById('a-'+i).value=state.alloc[i].toFixed(2);updateBudget();}
function advanceState(){if(gmEnded()||state.history.length>=10)return false;let next=state.result.next,c=state.ctx;state.ctx=newContext(randSeed(),c.year+1,next.budget,next);state.choice=state.ctx.coach?'retain':'hire';normalizeFinance();state.alloc=fitAlloc(state.alloc,funds());state.result=null;state.phase='build';return true;}
function advance(){advanceState();render();window.scrollTo(0,0);}
let autoRunning=false;
function autoButton(){return `<button class="small full" id="autoFinish">Sim remaining seasons →</button><p class="notice">Finish the dynasty automatically using your current strategy.</p>`;}
function autoPlan(plan){
 state.choice=state.ctx.coach?'retain':'hire';state.ctx.contractYears=plan.term;
 state.off=plan.off;state.def=plan.def;state.ctx.personnel={...plan.personnel};
 state.alloc=fitAlloc(plan.alloc,funds());
}
async function finishDynasty(){
 if(autoRunning||gmEnded()||state.mode!=='dynasty'||state.history.length===0||state.history.length>=10||(state.phase==='build'&&!validAllocation()))return;
 const count=10-state.history.length;
 if(!confirm(`Simulate the remaining ${count} season${count===1?'':'s'}? Your current allocations, room strategies and schemes will guide future years. The computer will keep active coaching contracts, offer renewals or hire replacements using your spending strategy, and never voluntarily fire a coach. Existing buyouts, departures, fan pressure and revenue changes still apply. Current financial decisions are honored; the computer will not make new reserves, sell naming rights or start stadium upgrades in later years. Your current ticket policy continues. If you are fired as GM, the simulation ends immediately. You cannot undo the results.`))return;
 const plan={alloc:[...state.alloc],off:state.off,def:state.def,personnel:{...state.ctx.personnel},term:clamp(state.phase==='result'?(state.result.roster.coach.contractYears||4):proposedTerm(state.ctx,state.choice),3,7)};
 autoRunning=true;const newBtn=document.getElementById('newBtn'),helpBtn=document.getElementById('helpBtn');newBtn.disabled=helpBtn.disabled=true;
 const yieldUI=()=>new Promise(resolve=>setTimeout(resolve,25));
 try{
  while(state.history.length<10&&!gmEnded()){
   if(state.phase==='result'){advanceState();autoPlan(plan);}
   renderHero();app.innerHTML=`<section class="section" role="status" aria-live="polite"><div class="eyebrow">DYNASTY AUTO-SIM</div><h2>Simulating ${calendarYear(state.ctx.year)}…</h2><p class="notice">${state.history.length} of 10 seasons complete. Your existing results are preserved.</p><div class="bar"><i style="width:${state.history.length*10}%"></i></div>${history()}</section>`;
   await yieldUI();
   if(!commitSeason(true))throw new Error('Automatic allocation exceeded the available budget.');
   save();
  }
 }catch(err){console.error(err);alert('Automatic simulation stopped. Your completed seasons are saved; you can continue manually.');}
 finally{autoRunning=false;newBtn.disabled=helpBtn.disabled=false;render();window.scrollTo(0,0);}
}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.share){shareResult(d.share,d.kind,b.closest('.sharebar'));return;}if(d.conf&&CONFERENCES[d.conf]&&state.phase==='build'&&!programLocked()){browseConference=d.conf;render();app.querySelector('[data-conf="'+d.conf+'"]')?.focus({preventScroll:true});return;}if(d.school&&state.phase==='build'&&!programLocked()){let k=d.schoolConf;if(!SCHOOLS[k]||!Object.hasOwn(SCHOOLS[k],d.school))return;state.ctx.conference=k;state.ctx.school=d.school;browseConference=k;state.ctx.schedule=schedule(seedFor(state.ctx.seed,2),k,d.school,state.ctx.year);render();Array.from(app.querySelectorAll('[data-school]')).find(b=>b.dataset.school===d.school)?.focus({preventScroll:true});return;}if(d.mode){setMode(d.mode);return;}if(d.preset){state.alloc=d.preset==='zero'?[lockedSalary()??minSalary(),...Array(GROUPS.length-1).fill(0)]:fitAlloc(PRESETS[d.preset],funds());render();return;}if(d.reserveAdj){let k=Number(d.reserveAdj);adjustReserve(finances(state.ctx,state.choice).reserveOut+k*.25,k);return;}if(d.adj){let [i,k]=d.adj.split(',').map(Number);adjust(i,state.alloc[i]+k*.25);return;}if(d.coach){state.choice=d.coach;normalizeFinance();state.ctx.contractYears=proposedTerm(state.ctx,state.choice);if(lockedSalary()!==null)state.alloc[0]=lockedSalary();else state.alloc[0]=Math.max(minSalary(),state.alloc[0]);render();return;}switch(b.id){case'upgradeToggle':if(state.mode==='dynasty'&&state.phase==='build'&&upgradeAllowed(state.ctx,state.choice)){state.ctx.upgradePending=!state.ctx.upgradePending;normalizeFinance();state.alloc=fitAlloc(state.alloc,funds());render();}break;case'namingToggle':if(state.mode==='dynasty'&&state.phase==='build'&&!state.ctx.namingSold){state.ctx.namingPending=!state.ctx.namingPending;normalizeFinance();state.alloc=fitAlloc(state.alloc,funds());render();}break;case'fill':state.alloc=fitAlloc(state.alloc,funds());render();break;case'play':b.textContent='Simulating…';b.disabled=true;setTimeout(play,20);break;case'advance':advance();break;case'autoFinish':finishDynasty();break;case'restart':state=initial(state.mode,state.ctx.conference);render();window.scrollTo(0,0);break;}});
app.addEventListener('input',e=>{if(e.target.id.startsWith('a-')&&e.target.value!==''&&Number.isFinite(+e.target.value)){let i=+e.target.id.slice(2);if(i===0&&lockedSalary()!==null)return;state.alloc[i]=roundQ(clamp(+e.target.value,i===0?minSalary():0,i===0?Math.min(funds(),maxSalary()):funds()));updateBudget();}});
app.addEventListener('change',e=>{let id=e.target.id;if(id==='ticketPolicy'&&state.mode==='dynasty'&&state.phase==='build'&&Object.hasOwn(TICKET_POLICIES,e.target.value)){state.ctx.ticketPolicy=e.target.value;normalizeFinance();state.alloc=fitAlloc(state.alloc,funds());render();return;}if(id==='reserveOut'){adjustReserve(Number(e.target.value));return;}if(id.startsWith('personnel-')){let i=+id.slice(10);if(i>0&&i<GROUPS.length&&state.ctx.returning?.[i]&&Object.hasOwn(PERSONNEL,e.target.value)){state.ctx.personnel??={};state.ctx.personnel[i]=e.target.value;updateBudget();}return;}if(id==='contractYears'){state.ctx.contractYears=+e.target.value;state.ctx.contractYears=proposedTerm(state.ctx,state.choice);e.target.value=state.ctx.contractYears;updateBudget();return;}if(id.startsWith('a-'))adjust(+id.slice(2),+e.target.value);if(id==='off'||id==='def'){state[id]=e.target.value;document.getElementById(id+'desc').textContent=(id==='off'?OFF:DEF)[state[id]][1];document.getElementById(id+'impact').innerHTML=schemePanel(id);updateBudget();}});
document.getElementById('newBtn').onclick=()=>{if(!state.history.length&&!state.result||confirm('Reset the current game and start over?')){state=initial(state.mode,state.ctx.conference);render();window.scrollTo(0,0);}};
document.getElementById('helpBtn').onclick=()=>{let d=document.createElement('dialog');d.style.cssText='background:#1b2a22;color:#f1f1e8;border:1px solid #526d4a;border-radius:12px;max-width:580px;padding:24px;width:calc(100% - 30px)';d.innerHTML='<h2>How to play Saturday GM</h2><p style="margin-top:12px">Choose Dynasty (10 years) or Single season. Browse a conference and select a school (locked after year one in Dynasty; later years show a program outlook). Real schools play conference-specific schedules with simulated strengths; published opponent slates are used where encoded, and future rotations and nonconference dates are modeled. ACC has one rotating eight-game member; all other members play nine league games. Pick your schemes, assess the talent market and schedule, and allocate the full budget across the head coach and 13 position groups. No individual player names.</p><p style="margin-top:12px">In Dynasty, each year carries forward talent, depth, returning-player costs, coaching continuity and prestige. Starting in year two, each player room offers Retain (prioritize continuity), Reinforce (default; balance retention and upgrades), or Rebuild (replace eligible returners, with greater recruiting uncertainty and less experience). Your projections update immediately. Manual offseasons default to Reinforce; auto-sim carries your latest room strategies forward. Results affect next year’s budget. Dynasty financial decisions allow a one-year reserve of up to 20% of ordinary revenue, with unchanged win targets and extra backlash for saving while underperforming. Prior reserves must be spent the next season; none can be created in Year 10. Naming rights can be sold once for an additional $1M each season, at a one-time fan and donor confidence cost. Financial changes proportionally refit your allocations; review before playing. The sale locks on playing the season. Annual ticket policy trades revenue against fan pressure; higher prices earn less when demand is weak. Stadium upgrades cost $7M once, with $2.5M annual revenue starting two seasons later. The investment locks when the season is played. Auto-sim continues your ticket policy and existing projects but initiates no new upgrades. Prior revenue gains fade, but revenue lost through underperformance is not automatically restored. Donor confidence persists: sustained disappointments depress funding, raise recruiting costs and accelerate portal attrition; meeting expectations helps restore revenue. Recent elite seasons temporarily raise future win expectations. Firing coaches repeatedly delivers diminishing fan relief. Quarterback recruiting includes a small chance of a large miss or breakout, and QB injuries can be longer and more consequential. The national player market grows 1.8% annually. NFL departures and higher retention asks are more pronounced for successful elite rooms; national playoff field strength varies each season independently of your past titles; talented backups seek starting opportunities, particularly at QB, tackle and specialist positions. Paying more helps but cannot buy unlimited depth. Offensive and defensive system mastery accumulate separately (capped at five years). Changing a scheme creates personnel-fit, retention and early-season execution penalties proportional to the size of the transition. Coaching continuity is separate. Fans react to school-specific win expectations and rivalry results. Marquee rivalries carry twice the fan-pressure weight of secondary rivalries. Rivalry results also directly affect donor support (capped at 1.5% of gross revenue per year); prolonged underperformance or rivalry frustration can add a revenue penalty. Choose a 3–7 year coaching contract (four years by default). Renewals and extensions must also cover at least three seasons; keeping an existing deal does not reset its term. Annual salary is locked until expiry or an extension (no salary reduction). Coaches may leave voluntarily when underpaid relative to market value; longer remaining terms modestly reduce that risk. Voluntary departures and expired contracts carry no buyout. At expiration, the coach always considers a renewal offer first; the displayed acceptance chance reflects salary relative to market value and contract length. If declined, a replacement is hired at the same offered terms. Firing an active coach costs 75% of the remaining salary commitment, rounded to $0.25M and normally paid over three years (very large combined obligations are deferred to preserve a playable roster budget), partially offset in year one by donor enthusiasm when pressure is high. Existing installments stack. OVR and letter depth grades are scouting estimates before recruitment and realized grades after the season.</p><p style="margin-top:12px">The simulator uses diminishing returns, complementary skills and matchup-specific strengths. Salary weakly predicts coaching quality and competes with player spending. The new-hire rating is a central scouting projection; the elite-hire probability accounts for uncertainty. Paying a returning coach more improves retention, not ability. Injuries, turnover variance, development and execution are simulated independently of your decisions where appropriate. School choice fixes conference schedule strength, conference title prospects and long-run revenue limits; school-specific expectations and rivalries also matter. Beginning in 2027, the 24-team CFP has automatic bids for conference champions, simulated at-large selection by record and schedule strength, and first-round byes for the top eight seeds. Seeds 9–16 host round one; top eight seeds host round two. Quarterfinals and later rounds are neutral. Conference titles are assigned from regular-season records with simplified tiebreaks. The 24-team format is assumed to continue throughout the 2027–2036 dynasty.</p><p style="margin-top:12px">After each season, the report shows expected wins and luck based on simulations of your committed roster. You cannot evaluate alternative allocations before playing or replay the same season with a different budget. After at least one completed dynasty season, Sim remaining seasons finishes the campaign using your latest roster spending proportions and schemes. Existing coaching contracts are honored; renewals and replacements follow your spending strategy, and the computer does not voluntarily fire coaches. All other offseason and season mechanics still apply. Auto-simulated years are labeled in history and final results. Your job security is separate from the coach’s. Sustained underperformance, rivalry losses, shrinking revenue and buyouts can put you on the GM hot seat. The board will not fire you after your first season or without prior warning. A championship earns goodwill, not permanent immunity. GM dismissal ends the dynasty, including auto-sim, and produces a shareable career report. Your game is saved locally when browser storage permits.</p><p style="margin-top:12px" class="muted">This is an experimental game model, not empirical football forecasting.</p><button class="primary full">Close</button>';document.body.append(d);d.querySelector('button').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.showModal();};
