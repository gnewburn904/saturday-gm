if(state.phase==='build'&&lockedSalary()!==null&&state.alloc[0]!==lockedSalary())state.alloc=fitAlloc(state.alloc,funds());
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved on this device';}catch(e){storageOK=false;document.getElementById('saveStatus').textContent='Local save unavailable';}}
function setMode(m){if(!['dynasty','single'].includes(m)||m===state.mode)return;if((state.history.length||state.result)&&!confirm('Start a new game in this mode? Your current campaign will be replaced.'))return;state=initial(m,state.ctx.conference);render();}
function metric(label,value,sub=''){return `<div class="metric"><span>${label}</span><b>${value}</b>${sub?`<small>${sub}</small>`:''}</div>`;}
function head(title,sub=''){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`;}
function marketLabel(i){let x=state.ctx.market[i].price;return x<.91?['Deep','deep']:x>1.10?['Scarce','scarce']:['Normal',''];}
function history(){if(!state.history.length)return '<p class="muted">Your program history starts here.</p>';return `<table class="hist"><thead><tr><th>Season</th><th>Record</th><th>Budget</th><th>Outcome</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${calendarYear(h.year)}${h.auto?' <small class="muted" title="Automatically simulated">AUTO</small>':''}</td><td>${h.wins}–${h.losses}</td><td>${fmt(h.budget)}</td><td class="${h.champ?'gold':''}">${h.champ?'★ ':''}${h.outcome}</td></tr>`).join('')}</tbody></table>`;}
function header(){let h=state.history,c=state.ctx,mode=state.mode;return `<div class="tabs" aria-label="Game modes">${[['dynasty','Dynasty · 10 years'],['single','Single season']].map(([m,t])=>`<button data-mode="${m}" aria-pressed="${m===mode}">${t}</button>`).join('')}</div>${state.phase==='build'&&!hasProgram()?'':`<div class="metrics">${metric('Mode',mode==='dynasty'?'Dynasty':'Single season',mode==='dynasty'?`${programName(c)} · ${calendarYear(c.year)} · Year ${c.year} of 10`:`${programName(c)} · ${calendarYear(c.year)}`)}${metric('Gross revenue',fmt(c.budget),c.year>1?'Before coaching buyouts':'Starting allocation')}${metric('Program prestige',Math.round(c.prestige)+'/100','Affects recruiting leverage')}${metric('National titles',h.filter(x=>x.champ).length,`${sum(h.map(x=>x.wins))}–${sum(h.map(x=>x.losses))} career record`)}</div>${mode==='dynasty'?`<div class="progress" aria-label="Dynasty progress">${Array.from({length:10},(_,i)=>`<i class="${i<h.length?'done':i===h.length?'current':''}"></i>`).join('')}</div><p class="notice" style="margin-bottom:18px">${c.revenueNote}</p>`:''}`}`;}
function rosterOutlook(next){if(!next?.departures)return '';let top=[...next.departures].sort((a,b)=>(b.portal+b.draft)-(a.portal+a.draft)).slice(0,4);return `<div style="margin-top:16px"><h3>Offseason roster turnover</h3><p class="notice">Graduation, NFL opportunities and transfers reduce the talent you can retain. Successful starters command premiums, while backups seek playing time elsewhere.</p><div class="compare">${top.map(d=>`<div><span class="tag">${GROUPS[d.i].name}</span><b>${pct(d.share)} eligible</b><small>Portal ${pct(d.portal)} of post-draft pool · NFL ${pct(d.draft)} of post-graduation pool</small></div>`).join('')}</div><p class="notice">National player market: +${((wageIndex({year:state.ctx.year+1})-1)*100).toFixed(1)}% versus 2027. Retention asks for successful elite talent include salary premiums.</p></div>`;}

","#e8000d"],"Kansas State":["#512888","#b1b3b3"],"Oklahoma State":["#ff7300","#000000"],"TCU":["#4d1979","#ffffff"],"Texas Tech":["#cc0000","#000000"],"UCF":["#000000","#ba9b37"],"Utah":["#cc0000","#ffffff"],"West Virginia":["#002855","#eaaa00"]};
function schoolDot(name){let [a,b]=SCHOOL_COLORS[name]||['#a2b3a7','#34483b'];return `<span class="school-dot" style="--school1:${a};--school2:${b}" aria-hidden="true"></span>`;}
function isPriority(i){return PRIORITY.off[state.off].includes(i)||PRIORITY.def[state.def].includes(i);}
function renderHero(){let c=state.ctx,h=state.history,el=document.getElementById('heroContent');let hero=el.closest('.hero'),colors=SCHOOL_COLORS[c.school];hero.classList.toggle('has-school',!!colors&&hasProgram());if(colors&&hasProgram()){hero.style.setProperty('--school1',colors[0]);hero.style.setProperty('--school2',colors[1]);}else{hero.style.removeProperty('--school1');hero.style.removeProperty('--school2');}el.innerHTML=hasProgram()?`<div class="hero-title"><div class="eyebrow">${league(c).name} · ${state.mode==='dynasty'?'Dynasty':'Single season'}</div><h1>${programName(c).split(' · ')[0].toUpperCase()}</h1></div><div class="hero-meta"><div><span>Season</span><b>${calendarYear(c.year)}</b></div><div class="hero-career"><span>Career record</span><b>${sum(h.map(x=>x.wins))}–${sum(h.map(x=>x.losses))}</b></div></div>`:'<div class="hero-title"><h1>Build Your Dynasty.</h1></div>';}
function row(g,i){let c=state.ctx,[label,klass]=marketLabel(i),old=c.returning?.[i];let detail=i===0&&c.coach?`Returning coach · ${Math.round(c.coach.quality)}/100 · market value ${fmt(c.coach.ask)}`:old?`${Math.round(old.share*100)}% eligible to return · ${Math.round(old.talent)}/100 talent · ${fmt(old.ask)} retention ask${old.portal!==undefined?' · portal attrition '+pct(old.portal):''}`:g.desc;return `<div class="alloc"><div><div class="pos">${g.name}<span class="scheme-pill" id="priority-${i}" ${isPriority(i)?'':'hidden'} title="Premium position for your selected scheme">SCHEME</span></div><div class="detail">${detail}</div><div class="room-scout" id="scout-${i}" aria-live="polite"></div>${i?`<div class="detail">Playing-time competition: ${snapLabel(i)}</div>`:''}${old&&i?`<div class="personnel-choice"><label for="personnel-${i}">Room strategy</label><select id="personnel-${i}" aria-label="${g.name} room strategy">${Object.entries(PERSONNEL).map(([k,v])=>`<option value="${k}" ${personnelChoice(c,i)===k?'selected':''}>${v}</option>`).join('')}</select><div class="detail" id="personnel-note-${i}"></div></div>`:''}</div><div class="market ${klass}"><span class="market-pill">${label}</span><small>${Math.round((c.market[i].price-1)*100)>=0?'+':''}${Math.round((c.market[i].price-1)*100)}% market price</small>${old?`<small id="ret-${i}"></small>`:''}</div><div class="moneyinput"><button data-adj="${i},-1" ${i===0&&lockedSalary()!==null?'disabled':''} aria-label="Decrease ${g.name}">−</button><input id="a-${i}" type="number" ${i===0&&lockedSalary()!==null?'disabled':''} min="${i===0?minSalary():0}" max="${i===0?Math.min(funds(),maxSalary()):funds()}" step="0.25" value="${state.alloc[i].toFixed(2)}" aria-label="${g.name} allocation in millions"><button data-adj="${i},1" ${i===0&&lockedSalary()!==null?'disabled':''} aria-label="Increase ${g.name}">+</button><span class="suffix">M</span></div><div class="spendbar" role="img" id="share-${i}" aria-label="Share of available budget (full bar at 25%)"><i id="spend-${i}"></i></div></div>`;}
function confidenceLabel(v){return v>=80?'Strong':v>=60?'Stable':v>=40?'Wavering':'Fragile';}
function confidenceReport(c){let v=c.donorConfidence??70;return `<div class="budgetline"><span>Donor confidence · ${confidenceLabel(v)}</span><b class="${v<40?'danger':v<60?'gold':'positive'}">${Math.round(v)}/100</b></div><p class="notice">${v<55?`Lingering donor distrust and recruiting premiums make recovery harder. Only improved results rebuild confidence.`:'Confidence changes gradually; a coaching change does not erase past disappointments.'}${c.earnedTarget?` Recent success still shapes expectations.`:''}</p>`;}
function fanPanel(c){let f=finances(c,state.choice),p=c.fanPressure??15;return `<section class="section fanpanel">${head('Fan pressure & coaching hot seat','Fans expect at least '+expectation(c)+' regular-season wins. Rivalry results also matter.') }<div class="pressurelabel ${fanTone(p)}">${hotSeat(p)} · ${Math.round(p)}/100</div><div class="pressurebar"><i style="width:${p}%;background:${p>=60?'var(--red)':p>=40?'var(--gold)':'var(--green)'}"></i></div>${confidenceReport(c)}${c.rivalry?.games?.length?`<p class="notice">Last season's rivalries: ${c.rivalry.wins}–${c.rivalry.losses} · ${signed(c.rivalry.pressure)} fan pressure points.</p>`:''}${c.fanPenalty?`<p class="notice danger">Last season’s fan backlash cut gross revenue by ${(c.fanPenalty*100).toFixed(1)}% before the floor.</p>`:''}${c.coach?`<p class="notice">${yearsLeft(c.coach)>0?`Coach in year ${c.coach.tenure}; keeping a struggling coach risks further donor losses. Firing resets some pressure but triggers a buyout on the remaining guaranteed contract.`:`The coaching contract has expired. You can offer a new deal or hire a replacement with no new buyout.`}</p><div class="budgetline"><span>If replaced: total buyout</span><b>${fmt(finances(c,'hire').totalBuyout)}</b></div><div class="budgetline"><span>Potential fan enthusiasm offset (year 1)</span><b class="positive">${fmt(finances(c,'hire').relief)}</b></div>${f.fire?`<p class="notice positive">Projected pressure after firing: ${Math.round(f.pressure)}/100 (${hotSeat(f.pressure)}). The hire is not final until you play.</p>`:''}`:`<p class="notice">${c.coachEvent||'A new program gets a little patience. Expectations rise as prestige and revenue grow.'}</p>`}${(c.buyouts||[]).some(Boolean)?`<p class="notice gold">Existing buyout schedule: ${c.buyouts.map((v,i)=>calendarYear(c.year+i)+': '+fmt(v)).join(' · ')}</p>`:''}</section>`;}
function conferenceOutlook(c){let l=league(c),strength=sos(c),last=state.history.at(-1),atLarge=w=>atLargeOdds(c,w);let outlook=last?`Last season: ${last.reg}–${12-last.reg} regular season · ${last.outcome}.`:'';return `<section class="section">${head((c.school||l.name)+' program outlook',calendarYear(c.year)+' · Year '+c.year+' of 10 · '+l.name+' · Program locked')}<p class="conf-intro">${l.desc} ${outlook}</p><div class="outlook-grid">${metric('Schedule strength',strength.toFixed(1)+'/100','Higher means tougher games')}${metric('Playoff field','24 teams','Top 8 earn a bye')}${metric('Fan win target',expectation(c),'Regular-season wins')}${metric('Gross revenue ceiling',fmt(l.ceiling),'Floor: '+fmt(l.floor))}</div><h3>Rivalries this season</h3><p class="notice">${rivalryList(c)}. Rivalry results have an additional effect on fan pressure and donor support.</p><h3>Road to the playoff</h3><p class="notice">At-large qualification odds at each regular-season record, if you do not win the conference:</p><div class="outlook-odds">${[7,8,9,10,11].map(w=>`<div><span>${w}–${12-w}</span><div class="bar"><i style="width:${atLarge(w)*100}%"></i></div><b>${pct(atLarge(w))}</b></div>`).join('')}</div><p class="notice">Conference titles are decided by regular-season standings (with simulated tiebreaks), not a championship game. Champions qualify automatically. Top-eight seeds earn a bye; seeds 9–16 host round one. A 9–3 team rarely earns a bye; eight-win teams cannot earn one in this model. National playoff opponents use the same seed-based difficulty scale across conferences. Odds reflect this year's schedule and the game's assumptions.</p></section>`;}
function conferencePanel(c){if(programLocked())return conferenceOutlook(c);let selected=browseConference||c.conference,dynasty=state.mode==='dynasty',labels={SEC:'Hardest road',BIG10:'High difficulty',ACC:'More favorable road',BIG12:'More favorable road'};let cards=Object.entries(CONFERENCES).map(([k,v])=>`<button type="button" class="conf-card" data-conf="${k}" aria-pressed="${selected===k}"><span class="conf-top"><strong>${v.name}</strong><span class="conf-check">${selected===k?'✓ Browsing':''}</span></span><span class="conf-level">${labels[k]}</span><span class="conf-desc">${v.desc}</span>${dynasty?`<span class="conf-facts"><span>Revenue ceiling <b>${fmt(v.ceiling)}</b></span></span>`:''}</button>`).join('');let schools=Object.keys(SCHOOLS[selected]).sort().map(n=>`<button type="button" class="school-btn" data-school="${n}" data-school-conf="${selected}" aria-pressed="${n===c.school&&selected===c.conference}">${schoolDot(n)}<span>${n}</span></button>`).join('');let preview=c.school?`<div class="chosen-program"><h3>${c.school} · ${league(c).name}</h3><div class="outlook-grid">${metric('Starting budget',fmt(c.budget))}${metric('Schedule strength',sos(c).toFixed(1)+'/100')}${metric('Fan win target',expectation(c),'Regular-season wins')}${metric('8–4 at-large odds',pct(atLargeOdds(c,8)),'Without a league title')}${dynasty?metric('Gross revenue ceiling',fmt(league(c).ceiling),'Floor: '+fmt(league(c).floor)):''}</div><p class="notice"><b>Rivalries this season:</b> ${rivalryList(c)}.</p></div>`:'<p class="notice gold">Select a school to reveal your program outlook and unlock season play.</p>';return `<section class="section">${head('Choose your program','Browse a conference, then select a school. Every school starts with $50M and equal starting prestige.') }<div class="conf-grid">${cards}</div><p class="notice">SEC and Big Ten schedules are generally tougher, with stronger at-large prospects and higher revenue limits. ACC and Big 12 offer a more favorable weekly schedule. Fan expectations depend on the school.</p><h3 style="margin-top:16px">${CONFERENCES[selected].name} programs</h3><div class="school-grid">${schools}</div>${preview}<p class="notice">School choice fixes your conference in Dynasty. Schools have different fan expectations, schedules and rivalries, but no hidden starting talent or recruiting advantage. All ratings and expectations are modeled.</p></section>`;}

function contractPanel(c){let old=c.coach,left=yearsLeft(old),locked=lockedSalary(),f=finances(c,state.choice),min=minimumTerm(c,state.choice);return `<div class="coachoptions">${old?`<button class="small" data-coach="retain" aria-pressed="${state.choice==='retain'}">${left?'Keep contract':'Re-sign coach'}</button>${left?`<button class="small" data-coach="extend" aria-pressed="${state.choice==='extend'}">Extend / raise</button>`:''}<button class="small" data-coach="hire" aria-pressed="${state.choice==='hire'}">${left?'Fire & replace':'Hire replacement'}</button>`:''}</div>${old?`<p class="notice">${left?`${left} season(s) remaining at ${fmt(old.salary)} per year. Current market value: ${fmt(old.ask)}.`:`Contract expired · Previous salary ${fmt(old.salary)} · Estimated market value ${fmt(old.ask)}. Make a renewal offer or hire a replacement without a buyout.`}</p>`:c.coachEvent?`<p class="notice gold">${c.coachEvent}</p>`:''}${locked===null?`<div class="field"><label for="contractYears">${state.choice==='extend'?'New total term from this season':'Contract length (3–7 years)'}</label><select id="contractYears">${Array.from({length:8-min},(_,i)=>i+min).map(y=>`<option value="${y}" ${y===proposedTerm(c,state.choice)?'selected':''}>${y} year${y===1?'':'s'}</option>`).join('')}</select></div>`:''}<div id="renewalOdds" aria-live="polite"></div><p class="notice" id="coachnote"></p>${f.fire?`<p class="notice gold">Total buyout ${fmt(f.totalBuyout)} · ${f.parts.map((v,i)=>calendarYear(c.year+i)+': '+fmt(v)).join(' · ')} · First-year donor offset ${fmt(f.relief)}</p>`:''}`;}
function schemePanel(side){let key=state[side],ctx=state.ctx,t=schemeTransition(ctx,side,key),dict=side==='off'?OFF:DEF;let names=PRIORITY[side][key].map(i=>GROUPS[i].id).join(' · ');return `<p><b class="positive">Premium rooms:</b> ${names}</p>${ctx.returning?`<div class="scheme-impact"><div class="tag">Previous system</div><b>${dict[t.prior][0]} · ${mastery(t.oldYears)} (Year ${t.oldYears}${t.oldYears===5?'+':''})</b><div class="tag" style="margin-top:8px">Next season</div><b class="${t.level>=3?'danger':t.level?'gold':'positive'}">${CHANGE_LABEL[t.level]} · ${mastery(t.years)}${t.years>1?' (Year '+t.years+(t.years===5?'+':'')+')':''}</b>${t.level?`<p>Opening-week execution: −${t.execution} OVR, easing during the season.<br>Returning talent effectiveness: −${Math.round(t.fit*100)}%.<br>Retention probability: −${Math.round(t.retention*100)} percentage points.</p>`:'<p>Preserves accumulated system mastery. No transition penalty.</p>'}</div>`:'<p>First-year installation. No inherited system mismatch.</p>'}`;}
function schemeFit(roster,side){let ids=PRIORITY[side][roster[side]],score=mean(ids.map(i=>roster.rooms[i].talent));return {score,grade:depthGrade(score),weak:ids.reduce((a,i)=>roster.rooms[i].talent<roster.rooms[a].talent?i:a,ids[0])};}
function transitionCost(ctx,roster,side){let t=roster.transition?.[side];if(!t?.level)return 0;let clean={...roster,transition:{...roster.transition,[side]:{...t,level:0,fit:0,execution:0}}};return sum(ctx.schedule.map((op,i)=>winProb(matchup(clean,op,{},0,0,i+1).margin)-winProb(matchup(roster,op,{},0,0,i+1).margin)));}
function schemeReport(ctx,roster){return `<section class="section">${head('Personnel & scheme fit','Priority-room talent grades and the direct on-field cost of changing systems.')}<div class="schemes">${['off','def'].map(side=>{let f=schemeFit(roster,side),t=roster.transition?.[side],dict=side==='off'?OFF:DEF;return `<div class="scheme-impact"><div class="tag">${side==='off'?'Offensive':'Defensive'} philosophy</div><h3>${dict[roster[side]][0]} · <span class="${f.score>=80?'positive':f.score<65?'danger':'gold'}">${f.grade}</span></h3><p class="notice">Priority-room average ${Math.round(f.score)} OVR. Weakest priority room: ${GROUPS[f.weak].name} (${Math.round(roster.rooms[f.weak].talent)} OVR).</p>${t?`<p class="notice">${mastery(t.years)} · ${CHANGE_LABEL[t.level]}.</p>${t.level?`<p class="gold">Direct transition cost: ${Math.max(0,transitionCost(ctx,roster,side)).toFixed(2)} expected regular-season wins.</p>`:''}`:''}</div>`}).join('')}</div><p class="notice">Transition cost compares this acquired roster with and without that side's execution and personnel-fit penalties; it excludes extra departures and lost mastery.</p></section>`;}
function build(){let c=state.ctx,old=c.coach;if(!hasProgram())return conferencePanel(c);return `<div class="layout"><div>${conferencePanel(c)}${state.mode==='dynasty'?`<div class="pressure-grid">${fanPanel(c)}${gmPanel(c.gm)}</div>`:''}<section class="section">${head('Football identity','Choose your scheme before buying talent. The same roster can perform differently in different systems.')}<div class="schemes"><div class="field"><label for="off">Offensive philosophy</label><select id="off">${Object.entries(OFF).map(([k,v])=>`<option value="${k}" ${state.off===k?'selected':''}>${v[0]}</option>`).join('')}</select><p id="offdesc">${OFF[state.off][1]}</p><div id="offimpact">${schemePanel('off')}</div></div><div class="field"><label for="def">Defensive philosophy</label><select id="def">${Object.entries(DEF).map(([k,v])=>`<option value="${k}" ${state.def===k?'selected':''}>${v[0]}</option>`).join('')}</select><p id="defdesc">${DEF[state.def][1]}</p><div id="defimpact">${schemePanel('def')}</div></div></div></section><section class="section">${head('Allocate your capital','Amounts in millions of dollars. Market prices vary by year; spending covers the entire room, including returning players. OVR, stars and depth are live scouting projections, not guarantees.')}<div class="preset">${[['balanced','Balanced'],['trenches','Trenches first'],['air','Air power'],['defense','Defense first'],['zero','Clear']].map(([k,v])=>`<button class="small" data-preset="${k}">${v}</button>`).join('')}</div>${GROUPS.map((g,i)=>(i===0||g.section!==GROUPS[i-1].section?`<div class="grouphead">${g.section}<span id="section-${g.section.replaceAll(' ','-')}"></span></div>`:'')+row(g,i)+(i===0?contractPanel(c):'') ).join('')}<details><summary>How to interpret the market</summary><p>A deep market stretches each dollar; a scarce market reduces purchasing power. Prices are relative to the typical market, not exact quotes. Retention asks cover eligible returning talent; falling short risks losing it. R function dynastyGrade(h){
 const titles=h.filter(x=>x.champ).length,playoffs=h.filter(x=>x.playoff).length,leagueTitles=h.filter(x=>x.confTitle).length,regWins=sum(h.map(x=>x.reg)),tenWins=h.filter(x=>x.reg>=10).length,losing=h.filter(x=>x.reg<6).length;
 if(titles>=4||(titles>=3&&playoffs>=8))return {grade:'S',tier:'GOAT',tone:'legend',story:'You didn’t just build a championship program. You defined an era. The rest of college football spent the decade trying to catch you; your legacy belongs in the conversation with the greatest to ever do it.'};
 if(titles>=2)return {grade:'A+',tier:'Dynasty builder',tone:'legend',story:'One championship can come from a magical season. Multiple championships are a legacy. You built a program capable of reaching the summit more than once.'};
 if(titles===1&&playoffs>=7)return {grade:'A+',tier:'National powerhouse',tone:'legend',story:'You captured a national championship and kept your program in the national conversation year after year. Your team became a fixture on the biggest stage.'};
 if(titles===1)return {grade:'A',tier:'National champion',tone:'strong',story:'You delivered the ultimate prize. A national championship banner will hang forever, even if the rest of the decade did not always match that extraordinary season.'};
 if(playoffs>=7&&regWins>=85)return {grade:'A−',tier:'Perennial contender',tone:'strong',story:'You built a team nobody wanted to face in December. The national title proved elusive, but sustained relevance is an achievement few programs can match.'};
 if(playoffs>=4||regWins>=80)return {grade:'B',tier:'Respectable program',tone:'solid',story:'You built a credible winner, with enough good seasons to keep supporters engaged. The next step is turning competitiveness into genuine championship contention.'};
 if(playoffs>=2||regWins>=65)return {grade:'C',tier:'Middle of the pack',tone:'solid',story:'There were moments of promise, but the program never established itself as a consistent threat. After a decade, fans are still waiting for the breakthrough.'};
 if(regWins>=50)return {grade:'D',tier:'Hot seat regular',tone:'struggle',story:'A decade of uneven football has worn down the fan base. Too many seasons ended with disappointment, and the program needs a different approach to roster construction.'};

}

function dynastySummary(){
 let h=state.history,t=h.filter(x=>x.champ).length,p=h.filter(x=>x.playoff).length,cc=h.filter(x=>x.confTitle).length,w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),cost=sum(h.map(x=>x.budget)),reg=sum(h.map(x=>x.reg)),ten=h.filter(x=>x.reg>=10).length,losing=h.filter(x=>x.reg<6).length,grade=dynastyGrade(h),first=h[0].gross??h[0].budget,last=h.at(-1).gross??h.at(-1).budget,change=last-first,pressure=state.result?.next?.fanPressure??h.at(-1).fanPressure??15,obligations=sum(state.result?.next?.buyouts||[]),finance=change>=5?'The program expanded its financial resources over the decade.':change<=-5?'The program finishes with a smaller revenue base than it started with.':'The program broadly preserved its starting revenue base.',fans=pressure>=60?'Fan patience is wearing thin.':pressure>=35?'The fan base remains uneasy.':'Fan pressure is low at the close of your tenure.';
 return `<section class="section dynasty-finale ${grade.tone}"><div class="eyebrow">2027–2036 · ${programName(state.ctx)} · Final legacy assessment</div><div class="legacy-heading"><div><div class="tag">Your legacy</div><h2>${grade.tier}</h2></div><div class="legacy-grade"><span>FINAL GRADE</span><b>${grade.grade}</b></div></div><p class="legacy-story">${grade.story}</p><div class="metrics">${metric('National titles',t,'Across ten seasons')}${metric('Career record',w+'–'+l,((w/(w+l))*100).toFixed(1)+'% win rate')}${metric('Playoff appearances',p+'/10')}${metric('Conference titles',cc)}</div><div class="legacy-stats">${metric('Regular-season wins',reg+'/120')}${metric('10-win regular seasons',ten+'/10')}${metric('Losing regular seasons',losing+'/10')}${metric('Final gross revenue',fmt(last),(change>=0?'+':'−')+fmt(Math.abs(change))+' vs. Year 1')}</div><h3>Program you leave behind</h3><p class="legacy-management">${finance} ${fans} ${obligations>0?fmt(obligations)+' in coaching buyouts remains payable after your final season.':'No outstanding coaching buyouts remain.'}</p><p class="notice">Average annual football allocation ${fmt(cost/h.length)} · ${fmt(cost/Math.max(1,w))} allocated per total win · Final fan pressure ${Math.round(pressure)}/100.</p>${h.some(x=>x.auto)?`<p class="notice">${h.filter(x=>!x.auto).length} manually managed seasons · ${h.filter(x=>x.auto).length} automatically simulated seasons.</p>`:''}${shareBar('dynasty')}<details><summary>How your legacy is graded</summary><p>Championships carry the most weight, followed by sustained playoff contention and regular-season wins. The financial and fan assessment describes the program you leave behind; it does not independently add points or reward spending more money. The grade is based on actual results, not simulated title odds.</p><ul><li>S · GOAT: 4+ titles, or 3+ titles and at least 8 playoff appearances.</li><li>A+ · Dynasty builder: 2+ titles (below GOAT).</li><li>A+ · National powerhouse: 1 title and 7+ playoff appearances.</li><li>A · National champion: 1 title.</li><li>A− · Perennial contender: no titles, 7+ playoff appearances and 85+ regular-season wins.</li><li>B · Respectable program: 4+ playoff appearances or 80+ regular-season wins.</li><li>C · Middle of the pack: 2+ playoff appearances or 65+ regular-season wins.</li><li>D · Hot seat regular: 50+ regular-season wins.</li><li>F · Program in ruins: fewer than 50 regular-season wins.</li></ul><p>Criteria apply in descending order. All conferences use the same legacy tiers; conference choice already changes competitive conditions.</p></details></section>`;
}

function shareBar(kind){return `<div class="sharebar" data-sharebar="${kind}"><span class="sharetitle">Share ${kind==='dynasty'?'your dynasty':'your season'}</span><button data-share="copy" data-kind="${kind}">Copy results</button><button data-share="image" data-kind="${kind}">Download result card</button>${typeof navigator.share==='function'?`<button data-share="native" data-kind="${kind}">Share…</button>`:''}<div class="sharestatus" role="status" aria-live="polite"></div></div>`;}
function shareData(kind){const c=state.ctx, s=state.result.s, h=state.history, conf=programName(c), year=calendarYear(c.year);if(kind==='dynasty'&&gmEnded()){let w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),t=h.filter(x=>x.champ).length,p=h.filter(x=>x.playoff).length;return {kind,school:c.school,slug:'dismissed-'+year,sub:`${conf}  /  2027–${year}`,headline:'RELIEVED OF DUTIES',record:`${w}–${l}`,recordLabel:'CAREER RECORD',badge:'FIRED AS GM',gold:false,stats:[['Seasons managed',`${h.length}/10`],['National titles',String(t)],['Playoff appearances',String(p)],['Outstanding buyouts',fmt(sum(state.result.next.buyouts||[]))]],story:dismissalStory(h),text:`THE PROGRAM | ${conf} | 2027–${year}\nFIRED AS GM after ${h.length} seasons\nCareer record: ${w}–${l} | National titles: ${t} | Playoff appearances: ${p}\nHow good is your program?`};}if(kind==='dynasty'){const grade=dynastyGrade(h),titles=h.filter(x=>x.champ).length,playoffs=h.filter(x=>x.playoff).length,cc=h.filter(x=>x.confTitle).length,w=sum(h.map(x=>x.wins)),l=sum(h.map(x=>x.losses)),last=h.at(-1).gross??h.at(-1).budget;return {kind,school:c.school,slug:'dynasty-2027-2036',sub:`${conf}  /  2027–2036${h.some(x=>x.auto)?`  /  ${h.filter(x=>x.auto).length} AUTO`: ''}`,headline:grade.tier.toUpperCase(),record:`${w}–${l}`,recordLabel:'CAREER RECORD',badge:`GRADE ${grade.grade}`,gold:grade.tone==='legend',stats:[['National titles',String(titles)],['Playoff appearances',`${playoffs}/10`],['Conference titles',String(cc)],['Final revenue',fmt(last)]],story:grade.story,text:`THE PROGRAM | Dynasty 2027–2036 (${conf})\n${grade.tier} • Grade ${grade.grade}\nCareer record: ${w}–${l}\nNational titles: ${titles} | Playoffs: ${playoffs}/10 | Conference titles: ${cc}\nFinal annual revenue: ${fmt(last)}${h.some(x=>x.auto)?`\n${h.filter(x=>!x.auto).length} manually managed seasons | ${h.filter(x=>x.auto).length} auto-simulated`: ''}\nHow good is your program?`};}let extras=[['Regular season',`${s.reg}–${12-s.reg}`],['Conference record',`${s.conf}–${(s.leagueGames??c.schedule.filter(g=>g.conf).length)-s.conf}`],['CFP seed',s.cfpSeed?'#'+s.cfpSeed:'—'],['Annual spending',fmt(state.result.spent??sum(state.result.alloc))]];return {kind,school:c.school,slug:'season-'+year,sub:`${conf}  /  ${year} SEASON`,headline:s.outcome.toUpperCase(),record:`${s.wins}–${s.losses}`,recordLabel:'FINAL RECORD',badge:s.champ?'NATIONAL TITLE':s.confTitle?'CONFERENCE TITLE':s.playoff?'PLAYOFF TEAM':'SEASON COMPLETE',gold:!!s.champ,stats:extras,story:s.confTitle?'Conference champions.':s.playoff?'Earned a place in the College Football Playoff.':'',text:`THE PROGRAM | ${year} (${conf})\n${s.wins}–${s.losses} • ${s.outcome}\nRegular season: ${s.reg}–${12-s.reg} | Conference: ${s.conf}–${(s.leagueGames??c.schedule.filter(g=>g.conf).length)-s.conf}${s.confTitle?' • Conference champions':''}${s.cfpSeed?'\nCFP seed: #'+s.cfpSeed:''}\nAnnual spending: ${fmt(state.result.spent??sum(state.result.alloc))}\nHow good is your program?`};}
function makeShareCard(d){let canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;let x=canvas.getContext('2d');let bg=x.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#263e2c');bg.addColorStop(1,'#111c17');x.fillStyle=bg;x.fillRect(0,0,1080,1080);x.strokeStyle='#d2ef9215';x.lineWidth=2;for(let i=0;i<=1080;i+=180){x.beginPath();x.moveTo(i,0);x.lineTo(i,1080);x.stroke();}let accent=d.gold?'#e5be77':'#d2ef92';let colors=SCHOOL_COLORS[d.school];x.fillStyle=colors?colors[0]:accent;x.fillRect(0,0,colors?810:1080,12);if(colors){x.fillStyle=colors[1];x.fillRect(810,0,270,12);}const display='"Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, system-ui, sans-serif';const text=(str,px,xx,yy,col='#f1f1e8',weight=700,max=0,athletic=false)=>{let family=athletic?display:'system-ui, sans-serif';if(athletic)weight=weight>=800?800:700;x.font=`${weight} ${px}px ${family}`;if(max){while(x.measureText(str).width>max&&px>18){px--;x.font=`${weight} ${px}px ${family}`;}}x.fillStyle=col;x.fillText(str,xx,yy);};const line=(y)=>{x.strokeStyle='#a2b3a750';x.beginPath();x.moveTo(65,y);x.lineTo(1015,y);x.stroke();};text('THE PROGRAM',52,65,85,'#d2ef92',800,0,true);text(d.sub,23,65,130,'#a2b3a7',700,950);line(156);text(d.badge,30,65,200,accent,800,950,true);text(d.headline,78,65,278,'#f1f1e8',800,950,true);text(d.recordLabel,22,65,327,'#a2b3a7',750);text(d.record,155,65,462,accent,800,950,true);d.stats.forEach(([label,value],i)=>{let xx=65+(i%2)*485,yy=510+Math.floor(i/2)*142;x.fillStyle='#111c1790';x.fillRect(xx,yy,465,125);text(label.toUpperCase(),20,xx+20,yy+35,'#a2b3a7',750,425);text(value,59,xx+20,yy+92,'#f1f1e8',800,425,true);});let y=825;if(d.story){let words=d.story.split(' '),lineText='';x.font='500 25px system-ui, sans-serif';for(let word of words){let attempt=lineText?lineText+' '+word:word;if(x.measureText(attempt).width>950&&lineText){text(lineText,25,65,y,'#d0dbd2',500);y+=34;lineText=word;}else lineText=attempt;}if(lineText)text(lineText,25,65,y,'#d0dbd2',500);}line(987);text('HOW GOOD IS YOUR PROGRAM?',31,65,1034,accent,800,950,true);return canvas;}
async function shareResult(action,kind,bar){let d=shareData(kind),status=bar.querySelector('.sharestatus');try{if(action==='copy'){let copied=false;try{await navigator.clipboard.writeText(d.text);copied=true;}catch(e){let t=document.createElement('textarea');t.value=d.text;t.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(t);t.select();try{copied=document.execCommand('copy');}finally{t.remove();}}if(!copied){window.prompt('Copy your results:',d.text);status.textContent='Results ready to copy.';}else status.textContent='Results copied. Paste into a message or post.';}else if(action==='native'){await navigator.share({title:'The Program results',text:d.text});status.textContent='';}else if(action==='image'){status.textContent='Preparing result card…';if(document.fonts){await Promise.race([Promise.allSettled([document.fonts.load('800 78px "Barlow Condensed"'),document.fonts.load('700 30px "Barlow Condensed"')]),new Promise(resolve=>setTimeout(resolve,1800))]);}let canvas=makeShareCard(d),a=document.createElement('a');a.download='the-program-'+d.slug+'.png';a.href=canvas.toDataURL('image/png');document.body.append(a);a.click();a.remove();status.textContent='Result card ready. Attach it to a message or social post.';}}catch(e){if(e.name!=='AbortError')status.textContent='Sharing was unavailable. Try Copy results or Download result card.';}}

function render(){let previousBars=Object.fromEntries(Array.from(app.querySelectorAll('#budgetbar,[id^=spend-]')).map(el=>[el.id,{width:el.style.width,background:el.style.background}]));renderHero();app.innerHTML=header()+(state.phase==='build'?build():result())+`<div class="foot">THE PROGRAM · Prototype v1.28 · A fictional football economics simulator. Outcomes reflect illustrative model assumptions, not calibrated predictions or actual NIL prices.</div>`;if(state.phase==='build'&&hasProgram()){for(let [id,v] of Object.entries(previousBars)){let el=document.getElementById(id);if(el){el.style.width=v.width;el.style.background=v.background;}}void app.offsetWidth;updateBudget();}else save();}
function adjust(i,v){if(i===0&&lockedSalary()!==null)return;state.alloc[i]=roundQ(clamp(Number.isFinite(v)?v:0,i===0?minSalary():0,i===0?Math.min(funds(),maxSalary()):funds()));document.getElementById('a-'+i).value=state.alloc[i].toFixed(2);updateBudget();}
function advanceState(){if(gmEnded()||state.history.length>=10)return false;let next=state.result.next,c=state.ctx;state.ctx=newContext(randSeed(),c.year+1,next.budget,next);state.choice=state.ctx.coach?'retain':'hire';state.alloc=fitAlloc(state.alloc,funds());state.result=null;state.phase='build';return true;}
function advance(){advanceState();render();window.scrollTo(0,0);}
let autoRunning=false;
function autoButton(){return `<button class="small full" id="autoFinish">Sim remaining seasons →</button><p class="notice">Finish the dynasty automatically using your current strategy.</p>`;}
function autoPlan(plan){
 state.choice=state.ctx.coach?'retain':'hire';state.ctx.contractYears=plan.term;
 state.off=plan.off;state.def=plan.def;state.ctx.personnel={...plan.personnel};
 state.alloc=fitAlloc(plan.alloc,funds());
}
async function finishDynasty(){
 if(autoRunning||gmEnded()||state.mode!=='dynasty'||state.history.length===0||state.history.length>=10||(state.phase==='build'&&!validAllocation()))return;
 const count=10-state.history.length;
 if(!confirm(`Simulate the remaining ${count} season${count===1?'':'s'}? Your current allocations, room strategies and schemes will guide future years. The computer will keep active coaching contracts, offer renewals or hire replacements using your spending strategy, and never voluntarily fire a coach. Existing buyouts, departures, fan pressure and revenue changes still apply. If you are fired as GM, the simulation ends immediately. You cannot undo the results.`))return;
 const plan={alloc:[...state.alloc],off:state.off,def:state.def,personnel:{...state.ctx.personnel},term:clamp(state.phase==='result'?(state.result.roster.coach.contractYears||4):proposedTerm(state.ctx,state.choice),3,7)};
 autoRunning=true;const newBtn=document.getElementById('newBtn'),helpBtn=document.getElementById('helpBtn');newBtn.disabled=helpBtn.disabled=true;
 const yieldUI=()=>new Promise(resolve=>setTimeout(resolve,25));
 try{
  while(state.history.length<10&&!gmEnded()){
   if(state.phase==='result'){advanceState();autoPlan(plan);}
   renderHero();app.innerHTML=`<section class="section" role="status" aria-live="polite"><div class="eyebrow">DYNASTY AUTO-SIM</div><h2>Simulating ${calendarYear(state.ctx.year)}…</h2><p class="notice">${state.history.length} of 10 seasons complete. Your existing results are preserved.</p><div class="bar"><i style="width:${state.history.length*10}%"></i></div>${history()}</section>`;
   await yieldUI();
   if(!commitSeason(true))throw new Error('Automatic allocation exceeded the available budget.');
   save();
  }
 }catch(err){console.error(err);alert('Automatic simulation stopped. Your completed seasons are saved; you can continue manually.');}
 finally{autoRunning=false;newBtn.disabled=helpBtn.disabled=false;render();window.scrollTo(0,0);}
}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.share){shareResult(d.share,d.kind,b.closest('.sharebar'));return;}if(d.conf&&CONFERENCES[d.conf]&&state.phase==='build'&&!programLocked()){browseConference=d.conf;render();app.querySelector('[data-conf="'+d.conf+'"]')?.focus({preventScroll:true});return;}if(d.school&&state.phase==='build'&&!programLocked()){let k=d.schoolConf;if(!SCHOOLS[k]||!Object.hasOwn(SCHOOLS[k],d.school))return;state.ctx.conference=k;state.ctx.school=d.school;browseConference=k;state.ctx.schedule=schedule(seedFor(state.ctx.seed,2),k,d.school,state.ctx.year);render();Array.from(app.querySelectorAll('[data-school]')).find(b=>b.dataset.school===d.school)?.focus({preventScroll:true});return;}if(d.mode){setMode(d.mode);return;}if(d.preset){state.alloc=d.preset==='zero'?[lockedSalary()??minSalary(),...Array(GROUPS.length-1).fill(0)]:fitAlloc(PRESETS[d.preset],funds());render();return;}if(d.adj){let [i,k]=d.adj.split(',').map(Number);adjust(i,state.alloc[i]+k*.25);return;}if(d.coach){state.choice=d.coach;state.ctx.contractYears=proposedTerm(state.ctx,state.choice);if(lockedSalary()!==null)state.alloc[0]=lockedSalary();else state.alloc[0]=Math.max(minSalary(),state.alloc[0]);render();return;}switch(b.id){case'fill':state.alloc=fitAlloc(state.alloc,funds());render();break;case'play':b.textContent='Simulating…';b.disabled=true;setTimeout(play,20);break;case'advance':advance();break;case'autoFinish':finishDynasty();break;case'restart':state=initial(state.mode,state.ctx.conference);render();window.scrollTo(0,0);break;}});
app.addEventListener('input',e=>{if(e.target.id.startsWith('a-')&&e.target.value!==''&&Number.isFinite(+e.target.value)){let i=+e.target.id.slice(2);if(i===0&&lockedSalary()!==null)return;state.alloc[i]=roundQ(clamp(+e.target.value,i===0?minSalary():0,i===0?Math.min(funds(),maxSalary()):funds()));updateBudget();}});
app.addEventListener('change',e=>{let id=e.target.id;if(id.startsWith('personnel-')){let i=+id.slice(10);if(i>0&&i<GROUPS.length&&state.ctx.returning?.[i]&&Object.hasOwn(PERSONNEL,e.target.value)){state.ctx.personnel??={};state.ctx.personnel[i]=e.target.value;updateBudget();}return;}if(id==='contractYears'){state.ctx.contractYears=+e.target.value;state.ctx.contractYears=proposedTerm(state.ctx,state.choice);e.target.value=state.ctx.contractYears;updateBudget();return;}if(id.startsWith('a-'))adjust(+id.slice(2),+e.target.value);if(id==='off'||id==='def'){state[id]=e.target.value;document.getElementById(id+'desc').textContent=(id==='off'?OFF:DEF)[state[id]][1];document.getElementById(id+'impact').innerHTML=schemePanel(id);updateBudget();}});
document.getElementById('newBtn').onclick=()=>{if(!state.history.length&&!state.result||confirm('Reset the current game and start over?')){state=initial(state.mode,state.ctx.conference);render();window.scrollTo(0,0);}};
document.getElementById('helpBtn').onclick=()=>{let d=document.createElement('dialog');d.style.cssText='background:#1b2a22;color:#f1f1e8;border:1px solid #526d4a;border-radius:12px;max-width:580px;padding:24px;width:calc(100% - 30px)';d.innerHTML='<h2>How to play The Program</h2><p style="margin-top:12px">Choose Dynasty (10 years) or Single season. Browse a conference and select a school (locked after year one in Dynasty; later years show a program outlook). Real schools play conference-specific schedules with simulated strengths; published opponent slates are used where encoded, and future rotations and nonconference dates are modeled. ACC has one rotating eight-game member; all other members play nine league games. Pick your schemes, assess the talent market and schedule, and allocate the full budget across the head coach and 13 position groups. No individual player names.</p><p style="margin-top:12px">In Dynasty, each year carries forward talent, depth, returning-player costs, coaching continuity and prestige. Starting in year two, each player room offers Retain (prioritize continuity), Reinforce (default; balance retention and upgrades), or Rebuild (replace eligible returners, with greater recruiting uncertainty and less experience). Your projections update immediately. Manual offseasons default to Reinforce; auto-sim carries your latest room strategies forward. Results affect next year’s budget. Prior revenue gains fade, but revenue lost through underperformance is not automatically restored. Donor confidence persists: sustained disappointments depress funding, raise recruiting costs and accelerate portal attrition; meeting expectations helps restore revenue. Recent elite seasons temporarily raise future win expectations. Firing coaches repeatedly delivers diminishing fan relief. Quarterback recruiting includes a small chance of a large miss or breakout, and QB injuries can be longer and more consequential. The national player market grows 1.8% annually. NFL departures and higher retention asks are more pronounced for successful elite rooms; national playoff field strength varies each season independently of your past titles; talented backups seek starting opportunities, particularly at QB, tackle and specialist positions. Paying more helps but cannot buy unlimited depth. Offensive and defensive system mastery accumulate separately (capped at five years). Changing a scheme creates personnel-fit, retention and early-season execution penalties proportional to the size of the transition. Coaching continuity is separate. Fans react to school-specific win expectations and rivalry results. Marquee rivalries carry twice the fan-pressure weight of secondary rivalries. Rivalry results also directly affect donor support (capped at 1.5% of gross revenue per year); prolonged underperformance or rivalry frustration can add a revenue penalty. Choose a 3–7 year coaching contract (four years by default). Renewals and extensions must also cover at least three seasons; keeping an existing deal does not reset its term. Annual salary is locked until expiry or an extension (no salary reduction). Coaches may leave voluntarily when underpaid relative to market value; longer remaining terms modestly reduce that risk. Voluntary departures and expired contracts carry no buyout. At expiration, the coach always considers a renewal offer first; the displayed acceptance chance reflects salary relative to market value and contract length. If declined, a replacement is hired at the same offered terms. Firing an active coach costs 75% of the remaining salary commitment, rounded to $0.25M and normally paid over three years (very large combined obligations are deferred to preserve a playable roster budget), partially offset in year one by donor enthusiasm when pressure is high. Existing installments stack. OVR and letter depth grades are scouting estimates before recruitment and realized grades after the season.</p><p style="margin-top:12px">The simulator uses diminishing returns, complementary skills and matchup-specific strengths. Salary weakly predicts coaching quality and competes with player spending. The new-hire rating is a central scouting projection; the elite-hire probability accounts for uncertainty. Paying a returning coach more improves retention, not ability. Injuries, turnover variance, development and execution are simulated independently of your decisions where appropriate. School choice fixes conference schedule strength, conference title prospects and long-run revenue limits; school-specific expectations and rivalries also matter. Beginning in 2027, the 24-team CFP has automatic bids for conference champions, simulated at-large selection by record and schedule strength, and first-round byes for the top eight seeds. Seeds 9–16 host round one; top eight seeds host round two. Quarterfinals and later rounds are neutral. Conference titles are assigned from regular-season records with simplified tiebreaks. The 24-team format is assumed to continue throughout the 2027–2036 dynasty.</p><p style="margin-top:12px">After each season, the report shows expected wins and luck based on simulations of your committed roster. You cannot evaluate alternative allocations before playing or replay the same season with a different budget. After at least one completed dynasty season, Sim remaining seasons finishes the campaign using your latest roster spending proportions and schemes. Existing coaching contracts are honored; renewals and replacements follow your spending strategy, and the computer does not voluntarily fire coaches. All other offseason and season mechanics still apply. Auto-simulated years are labeled in history and final results. Your job security is separate from the coach’s. Sustained underperformance, rivalry losses, shrinking revenue and buyouts can put you on the GM hot seat. The board will not fire you after your first season or without prior warning. A championship earns goodwill, not permanent immunity. GM dismissal ends the dynasty, including auto-sim, and produces a shareable career report. Your game is saved locally when browser storage permits.</p><p style="margin-top:12px" class="muted">This is an experimental game model, not empirical football forecasting.</p><button class="primary full">Close</button>';document.body.append(d);d.querySelector('button').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.showModal();};
render();
